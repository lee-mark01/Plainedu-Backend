      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePostRequest' }
      responses:
        '201':
          description: 생성됨
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Post' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }
    get:
      tags: [community]
      summary: 게시글 목록 (커서 기반)
      description: |
        무한 스크롤용. 다음 페이지는 마지막 항목의 `id`를 `cursor`로 넘긴다(내림차순).

        ⚠️ `keyword`와 `search_type`은 **반드시 함께** 보내야 한다 (Joi `.and()` — 하나만 오면 400).
      security: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: post_type
          in: query
          schema: { $ref: '#/components/schemas/PostType' }
        - name: stock_code
          in: query
          schema: { type: string }
          example: AAPL
        - name: keyword
          in: query
          schema: { type: string }
          description: '`search_type`과 함께 보낼 것'
        - name: search_type
          in: query
          schema:
            type: string
            enum: [TITLE, CONTENT, AUTHOR]
          description: '`keyword`와 함께 보낼 것'
      responses:
        '200': { $ref: '#/components/responses/PostPageOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/community/posts/my:
    get:
      tags: [community]
      summary: 내 게시글 목록 (커서 기반)
