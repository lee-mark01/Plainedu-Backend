openapi: 3.0.3

info:
  title: Plainedu API
  version: 1.0.0
  description: |
    청소년·대학생 대상 투자 학습/모의투자 서비스 **Plainedu**의 REST API 명세.

    - 이 문서는 [api-catalog.md](api-catalog.md)(전 도메인 API 목록)와 [api-conventions.md](api-conventions.md)(공통 규약)를 OpenAPI로 옮긴 것이다.
    - **API를 추가/변경/삭제한 사람이 같은 PR에서 이 파일과 api-catalog.md를 함께 갱신한다.**
    - 도메인별 상세 배경(산식·생명주기·Open Questions)은 [portfolio-api.md](portfolio-api.md), [ranking-api.md](ranking-api.md), [mypage-api.md](mypage-api.md), [stock-chart.md](stock-chart.md) 참조.

    ## 공통 규약

    **응답 봉투** — 성공 `{ "success": true, "data": ... }` / 실패 `{ "success": false, "message": "...", "code": "..." }`
    (`message`는 항상 한국어 문장이라 프론트가 그대로 노출 가능. `code`는 분기가 필요한 에러에만 부여)

    일부 레거시 엔드포인트는 `data` 없이 `{ success: true }` 또는 `{ success: true, message }`만 반환한다 —
    각 응답 스키마에 표기해 두었으니 프론트와 합의 없이 바꾸지 말 것.

    **인증** — `Authorization: Bearer {accessToken}`.
    401 + `TOKEN_EXPIRED`면 `POST /api/auth/refresh`로 재발급, `TOKEN_INVALID`면 재로그인.

    **검증** — Joi + `validate` 미들웨어. 실패 시 **400 + 첫 번째 에러 메시지**(code 없음).
    body·query·params 필드명은 `snake_case`가 원칙이나, learning·attendance 등 일부 도메인의 **응답**은
    `camelCase`를 쓴다(기존 프론트 연동 유지). 각 스키마의 실제 필드명을 따를 것.

    **페이지네이션** — 두 방식이 공존한다.
    · offset(`?page=&limit=` → `pagination: { page, limit, total }`) — 총 개수가 필요한 목록(주문·랭킹)
    · cursor(`?cursor=&limit=` → `hasNext`) — 무한 스크롤(커뮤니티 피드)

    **시간** — DB TIMESTAMP(UTC) → JSON ISO 8601 문자열. `DATE` 컬럼은 드라이버가 `Date`로 변환하므로
    별도 포맷팅이 없는 곳(예: 월별 출석의 `attendanceDates`)은 ISO date-time으로 내려간다.

    **실시간(Socket.IO)** — 시세 틱은 REST가 아니라 Socket.IO로 전달된다(OpenAPI 표현 불가).
    계약은 [stock-chart.md](stock-chart.md#socketio-실시간-계약) 참조:
    `subscribe`/`unsubscribe`(C→S), `subscribed`/`subscribe-error`/`price`/`resync`(S→C).

  contact:
    name: Plainedu Backend
    url: https://github.com/Plain-edu/Plainedu-Backend
  license:
    name: ISC

# 동일 오리진(`/`)이 먼저다 — 배포서버 /api-docs를 열었을 때 "Try it out"이
# localhost:3000으로 쏴서 실패하는 걸 막는다. 로컬에서 열면 `/`가 곧 localhost:3000이라 그대로 맞다.
servers:
  - url: /
    description: 문서를 열어둔 서버 (배포서버면 배포서버, 로컬이면 localhost:3000)
  - url: https://api.plainedu.org
    description: 개발 서버 (EC2 + Cloudflare)
  - url: http://localhost:3000
    description: 로컬 개발 서버

tags:
  - name: auth
    description: OAuth 로그인 · 토큰 재발급/무효화
  - name: user
    description: 마이페이지 프로필 · 출석
  - name: school
    description: 학교 검색 · 커리어넷 동기화
  - name: team
    description: 팀 생성/가입 · 팀 계좌
  - name: learning
    description: 학습(숏폼·퀴즈). 전 라우트 인증 필수.
  - name: community
    description: 게시글 · 댓글 · 좋아요/스크랩 · 팔로우 · 알림
  - name: stock
    description: 종목 검색 · 관심종목 · 시세 차트/현재가
  - name: trading
    description: 모의투자 주문 (개인 · 팀)
  - name: account
    description: 가상계좌 평가 · 자산 추이
  - name: portfolio
    description: 모델포트폴리오(MP) 작성·투표·전략 준수도
  - name: ranking
    description: 시즌 리그 (개인 · 팀 · 소속 2종)
  - name: system
    description: 헬스체크

security:
  - bearerAuth: []

paths:
  # ───────────────────────────── auth ─────────────────────────────
  /api/auth/kakao:
    post:
      tags: [auth]
      summary: 카카오 로그인
      description: |
        인가 코드를 카카오 토큰으로 교환해 프로필을 조회하고, 가입/로그인 후 토큰 쌍을 발급한다.
        로그인마다 개인 가상계좌 존재를 보장한다(없으면 생성).

        **연동 순서**
        1. 프론트가 카카오 인가 페이지로 이동 (`redirect_uri` = 프론트 콜백 주소)
        2. 카카오가 그 주소로 `code`를 붙여 되돌려보냄
        3. 프론트가 `code` + 1에서 쓴 `redirect_uri`를 이 API로 POST
        4. 서버가 카카오에 교환 요청 -> 프로필 조회 -> 가입/로그인 -> **서버 토큰 쌍** 발급

        응답의 `accessToken`/`refreshToken`은 **이 서버가 발급한 것**이다.
        카카오 토큰은 프로필 조회에만 쓰고 버리며 응답에 포함되지 않는다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OAuthCodeRequest' }
      responses:
        '200': { $ref: '#/components/responses/LoginOk' }
        '201': { $ref: '#/components/responses/LoginCreated' }
        '400':
          description: |
            인가 코드가 유효하지 않음. **가장 흔한 원인은 `redirect_uri` 불일치**로,
            인가 요청에 쓴 값과 문자열이 완전히 같아야 한다(슬래시·포트·http/https 포함).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: 카카오 이메일 제공 미동의 (`EMAIL_REQUIRED`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: 다른 소셜 계정으로 이미 가입됨 (`PROVIDER_CONFLICT`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/auth/naver:
    post:
      tags: [auth]
      summary: 네이버 로그인
      description: |
        카카오와 동일한 흐름이나 CSRF 방지용 `state`를 함께 보내야 한다.
        **네이버는 토큰 교환 시 `redirect_uri`를 요구하지 않아** 보내도 무시된다
        (`state`로 검증). 다른 provider와 동일하게 보내도 무방하다.

        응답의 `accessToken`/`refreshToken`은 **이 서버가 발급한 것**이다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/OAuthCodeRequest'
                - type: object
                  properties:
                    state:
                      type: string
                      description: 네이버 CSRF state 값
                      example: 'RANDOM_STATE'
      responses:
        '200': { $ref: '#/components/responses/LoginOk' }
        '201': { $ref: '#/components/responses/LoginCreated' }
        '400':
          description: |
            인가 코드가 유효하지 않음. **가장 흔한 원인은 `redirect_uri` 불일치**로,
            인가 요청에 쓴 값과 문자열이 완전히 같아야 한다(슬래시·포트·http/https 포함).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: 다른 소셜 계정으로 이미 가입됨 (`PROVIDER_CONFLICT`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/auth/google:
    post:
      tags: [auth]
      summary: 구글 로그인
      description: |
        카카오와 동일한 흐름. 구글도 인가/교환의 `redirect_uri`가 일치해야 한다.

        **연동 순서**
        1. 프론트가 구글 인가 페이지로 이동 (`redirect_uri` = 프론트 콜백 주소)
        2. 구글이 그 주소로 `code`를 붙여 되돌려보냄
        3. 프론트가 `code` + 1에서 쓴 `redirect_uri`를 이 API로 POST
        4. 서버가 구글에 교환 요청 -> 프로필 조회 -> 가입/로그인 -> **서버 토큰 쌍** 발급

        응답의 `accessToken`/`refreshToken`은 **이 서버가 발급한 것**이다.
        구글 토큰은 프로필 조회에만 쓰고 버리며 응답에 포함되지 않는다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OAuthCodeRequest' }
      responses:
        '200': { $ref: '#/components/responses/LoginOk' }
        '201': { $ref: '#/components/responses/LoginCreated' }
        '400':
          description: |
            인가 코드가 유효하지 않음. **가장 흔한 원인은 `redirect_uri` 불일치**로,
            인가 요청에 쓴 값과 문자열이 완전히 같아야 한다(슬래시·포트·http/https 포함).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: 다른 소셜 계정으로 이미 가입됨 (`PROVIDER_CONFLICT`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/auth/refresh:
    post:
      tags: [auth]
      summary: 액세스 토큰 재발급
      description: |
        리프레시 토큰을 회전(rotate)시키며 새 토큰 쌍을 발급한다.
        슬라이딩 만료 7일 · 절대 만료 90일(최초 발급 기준 고정).
        **이미 소비된 토큰이 다시 들어오면 탈취로 간주해 해당 계보(family) 전체를 폐기**한다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshTokenRequest' }
      responses:
        '200':
          description: 재발급 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/TokenPair' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: |
            `REFRESH_TOKEN_INVALID` · `REFRESH_TOKEN_EXPIRED` · `TOKEN_REUSE_DETECTED` → 모두 재로그인
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/auth/firebase-token:
    post:
      tags: [auth]
      summary: Firebase 세션을 백엔드 토큰으로 교환
      description: |
        Plain edu Firebase 프로젝트가 발급한 ID 토큰을 서버에서 검증하고 백엔드 사용자 및
        개인 가상계좌를 보장한 뒤 access/refresh 토큰 쌍을 발급한다. 기존 이메일 사용자가
        있으면 중복 계정을 만들지 않고 해당 사용자에 연결한다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FirebaseTokenRequest' }
      responses:
        '200': { $ref: '#/components/responses/LoginOk' }
        '201': { $ref: '#/components/responses/LoginCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: Firebase 토큰이 유효하지 않음 (`FIREBASE_TOKEN_INVALID`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/auth/logout:
    post:
      tags: [auth]
      summary: 로그아웃 (리프레시 토큰 계보 폐기)
      description: 존재하지 않는 토큰이어도 200 (멱등).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshTokenRequest' }
      responses:
        '200': { $ref: '#/components/responses/EmptySuccess' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/auth/email/send:
    post:
      tags: [auth]
      summary: 대학교 이메일 인증코드 발송
      description: |
        입력한 주소로 **6자리 숫자 인증코드**를 메일 발송한다(Redis 보관, **TTL 5분**).
        허용 도메인 목록(`src/data/universityEmailDomains`)에 없는 주소면 400 `INVALID_UNIVERSITY_EMAIL`.

        이 인증이 `Users.school_is_verified`를 켜므로 **팀 생성·가입의 선행 조건**이다 (AUTH-07 / PM-04).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email, example: student@yonsei.ac.kr }
      responses:
        '200':
          description: '레거시 응답 — `data` 없이 `{ success, message }`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageOnly' }
              example:
                success: true
                message: 인증코드가 발송되었습니다.
        '400':
          description: 이메일 형식 오류 / 대학교 이메일 아님 (`INVALID_UNIVERSITY_EMAIL`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/auth/email/verify:
    post:
      tags: [auth]
      summary: 대학교 이메일 인증코드 확인
      description: |
        코드가 맞으면 요청 유저의 `school_is_verified`를 `true`로 바꾸고 코드를 폐기한다(1회용).
        발송으로부터 5분이 지나면 400 `CODE_EXPIRED` → 재발송 필요.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email: { type: string, format: email, example: student@yonsei.ac.kr }
                code:
                  type: string
                  pattern: '^\d{6}$'
                  description: 6자리 숫자
                  example: '482913'
      responses:
        '200':
          description: '레거시 응답 — `data` 없이 `{ success, message }`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageOnly' }
              example:
                success: true
                message: 이메일 인증이 완료되었습니다.
        '400':
          description: |
            검증 실패 / 코드 만료·없음 (`CODE_EXPIRED`) / 코드 불일치 (`CODE_MISMATCH`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /auth/{provider}/callback:
    get:
      tags: [auth]
      summary: OAuth 리다이렉트 콜백 (테스트용)
      description: |
        `KAKAO_REDIRECT_URI` 등 제공사 콘솔에 등록된 리다이렉트 URI를 그대로 받는 엔드포인트.
        **`/api` prefix가 없다.** 프론트를 경유하지 않고 브라우저에서 바로 로그인 흐름을 확인할 때 쓴다.
        응답 본문은 `POST /api/auth/{provider}`와 동일 — 리다이렉트하지 않고 JSON을 그대로 반환한다.
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [kakao, naver, google]
        - name: code
          in: query
          required: true
          schema: { type: string }
          description: 제공사가 붙여주는 인가 코드
        - name: state
          in: query
          schema: { type: string }
          description: 네이버 전용 CSRF state
      responses:
        '200': { $ref: '#/components/responses/LoginOk' }
        '201': { $ref: '#/components/responses/LoginCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ───────────────────────────── user ─────────────────────────────
  /api/auth/phone/send:
    post:
      tags: [auth]
      summary: 휴대폰 인증번호 발송
      description: |
        Solapi로 6자리 인증번호를 SMS 발송한다. 번호는 하이픈이 있어도 되며 서버가 숫자만 남긴다.

        **문자는 건당 과금이라 이중으로 막는다.**
        - 레이트리밋: 유저당 시간당 3통 (`429 RATE_LIMITED`)
        - 재발송 쿨다운: 직전 발송 후 30초 (`429 RESEND_COOLDOWN`, `message`에 남은 초)

        이미 **다른 계정이 인증을 마친 번호**면 발송 전에 `409`로 거절한다
        (문자를 보내고 나서 실패시키면 비용은 나가고 유저는 코드를 받은 채 막힌다).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone:
                  type: string
                  description: 하이픈 포함/미포함 모두 허용
                  example: '010-1234-5678'
      responses:
        '200':
          description: 발송 성공. 쿨다운·만료 초를 함께 반환해 카운트다운에 쓴다.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      message: { type: string, example: 인증번호를 발송했습니다. }
                      data:
                        type: object
                        properties:
                          cooldownSeconds: { type: integer, example: 30 }
                          expiresInSeconds: { type: integer, example: 180 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: 이미 다른 계정에서 인증된 번호 (`PHONE_ALREADY_USED`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: |
            한도 초과(`RATE_LIMITED`) 또는 재발송 쿨다운(`RESEND_COOLDOWN`).
            `code`로 구분한다 - 쿨다운은 `message`에 남은 초가 들어 있다.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '502':
          description: SMS 발송 실패 (`SMS_SEND_FAILED`). 발신번호 미등록·잔액 부족 등.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/auth/phone/verify:
    post:
      tags: [auth]
      summary: 휴대폰 인증번호 확인
      description: |
        일치하면 `Users.phone`과 `phone_verified_at`을 기록한다. 코드 TTL은 3분이며
        성공 시 즉시 폐기된다. 상태는 `GET /api/users/me`의 `phone`으로 확인한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code]
              properties:
                phone: { type: string, example: '010-1234-5678' }
                code: { type: string, example: '123456' }
      responses:
        '200':
          description: 인증 완료
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      message: { type: string, example: 휴대폰 인증이 완료되었습니다. }
        '400':
          description: |
            코드 만료(`CODE_EXPIRED`) 또는 불일치(`CODE_MISMATCH`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: 이미 다른 계정에서 인증된 번호 (`PHONE_ALREADY_USED`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/users/me:
    get:
      tags: [user]
      summary: 마이페이지 프로필 (PM-01)
      description: |
        프로필 카드(닉네임·소속·역할) + 활동 요약(연속학습·포인트·리그순위) + 자산 요약을 한 번에 반환한다.
        `league_rank`는 ranking 도메인 조회 결과로, 순위판 미계산·학교 미설정 시 `null`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/MyProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
    patch:
      tags: [user]
      summary: 프로필 편집 (PM-03) · 학교 선택 (PM-04/AUTH-07)
      description: |
        `nickname`과 `school_id`를 바꾼다. **둘 다 선택 항목이고 최소 하나는 보내야 한다.**
        `position`은 여전히 이 API로 바꿀 수 없다(팀 생성·가입 시 결정).

        **학교 선택은 인증의 앞 절반이다.** `GET /api/schools`에서 고른 `school_id`를 여기로 보내면
        소속이 정해지고, 이어서 `POST /api/auth/email/send` → `/verify`로 대학 이메일 인증을 하면
        `school_is_verified`가 켜진다. 팀 생성·가입은 **둘 다** 필요하다.

        학교를 바꾸면 `school_is_verified`는 **자동으로 꺼진다** — 새 학교 이메일로 다시 인증해야 한다.
        개인계좌의 리그 그룹(고교/대학)도 새 학교 기준으로 다시 맞춰진다.

        인증 메일의 도메인이 선택한 학교와 같은 곳인지는 **대조하지 않는다**
        (도메인 목록이 학교 매핑 없는 평면 allow-list라 대조할 근거가 없음).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                nickname:
                  type: string
                  minLength: 1
                  maxLength: 50
                  example: 새닉네임
                school_id:
                  type: integer
                  minimum: 1
                  description: '`GET /api/schools` 검색 결과의 id'
                  example: 2
      responses:
        '200':
          description: 수정된 유저 기본 정보
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/UserBasic' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: 사용자 없음 / 존재하지 않는 `school_id`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: |
            팀에 소속된 상태에서 학교 변경 시도. 팀은 학교 단위로 묶여 있어 소속을 바꾸면
            팀과 학교가 어긋난다(팀 탈퇴 API가 생기면 탈퇴 후 변경 가능).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/ServerError' }
    delete:
      tags: [user]
      summary: 회원 탈퇴 (AUTH-14)
      description: FK CASCADE로 계좌·주문·출석·팀 멤버십·게시글·알림 등이 함께 삭제된다. 복구 불가.
      responses:
        '200':
          description: '레거시 응답 — `data` 없이 `{ success, message }`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageOnly' }
              example:
                success: true
                message: 회원 탈퇴가 완료되었습니다.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/users/me/agreements:
    patch:
      tags: [user]
      summary: 약관/개인정보/마케팅 동의
      description: |
        온보딩 2단계이자 마이페이지 수신 설정. **보낸 항목만 갱신한다**(부분 수정).

        **온보딩 순서**: 로그인 -> **동의** -> 학교 선택 -> 대학 이메일 인증 -> 팀 생성/가입.
        개인 모드는 동의까지만 하면 전부 사용할 수 있고, 학교/인증은 팀 진입 시에만 필요하다.

        진행 상태는 `GET /api/users/me`의 `agreements`로 판정한다 (별도 조회 API 없음).

        `terms`/`privacy`는 **`true`만 받는다.** 철회는 곧 서비스 이용 중단이라
        `DELETE /api/users/me`(탈퇴) 소관이며, 여기로 `false`를 보내면 `400`이다.
        `marketing`은 자유롭게 켜고 끌 수 있다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                terms: { type: boolean, enum: [true], description: 서비스 이용약관(필수), example: true }
                privacy: { type: boolean, enum: [true], description: 개인정보 처리방침(필수), example: true }
                marketing: { type: boolean, description: 마케팅 수신(선택), example: false }
      responses:
        '200':
          description: 갱신 후 전체 동의 상태
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          agreements:
                            type: object
                            properties:
                              terms: { type: boolean, example: true }
                              privacy: { type: boolean, example: true }
                              marketing: { type: boolean, example: false }
        '400':
          description: |
            보낸 항목이 없거나, 필수 동의에 `false`를 보냄
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/users/attendance/check-in:
    post:
      tags: [user]
      summary: 출석 체크인
      description: |
        앱 접속 시 프론트가 **명시적으로** 호출한다(GET에 부수효과를 두지 않기 위해 분리).
        오늘 이미 출석했으면 아무것도 하지 않고 200 (멱등).
        직전 출석과 하루 차이면 `consecutive_days`가 이어지고, 그 이상이면 1로 리셋된다.
      responses:
        '200':
          description: '레거시 응답 — `data` 없이 `{ success, message }`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageOnly' }
              example:
                success: true
                message: 출석 처리되었습니다.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/users/attendance/streak:
    get:
      tags: [user]
      summary: 이번 주 출석 + 연속학습일
      description: 칭찬 화면(퀴즈 완료 후 등)용. 이번 주 **월~일 7칸** 체크리스트를 항상 채워서 내려준다.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AttendanceStreak' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/users/attendance:
    get:
      tags: [user]
      summary: 월별 출석 조회
      description: '`year`·`month`는 **둘 다 보내거나 둘 다 생략**해야 한다(하나만 오면 400). 생략 시 이번 달.'
      parameters:
        - name: year
          in: query
          schema: { type: integer, minimum: 2020, maximum: 2100 }
          example: 2026
        - name: month
          in: query
          schema: { type: integer, minimum: 1, maximum: 12 }
          example: 8
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/MonthlyAttendance' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  # ──────────────────────────── school ────────────────────────────
  /api/schools:
    get:
      tags: [school]
      summary: 학교 검색
      description: 커리어넷에서 동기화한 학교 데이터를 검색한다. 조건 없이 호출하면 이름순 상위 `limit`건.
      security: []
      parameters:
        - name: keyword
          in: query
          schema: { type: string, maxLength: 100 }
          description: 학교명 부분 일치
          example: 연세
        - name: region
          in: query
          schema: { type: string, maxLength: 50 }
          description: 지역 완전 일치
          example: 서울
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/School' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/schools/sync:
    post:
      tags: [school]
      summary: 커리어넷 학교 동기화 (관리자 전용)
      description: |
        커리어넷 오픈 API를 페이지 순회하며 `schools` 테이블에 upsert 한다.
        `(school_name, region)` UNIQUE 기준이라 재실행해도 안전(멱등).
        **`role = ADMIN`이 아니면 403.** 전체 동기화는 수 분이 걸릴 수 있다.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                gubuns:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    enum: [elem_list, midd_list, high_list, univ_list]
                  description: '생략 시 서비스 기본값 `[high_list, univ_list]`'
            example:
              gubuns: [high_list, univ_list]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/SchoolSyncResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 관리자 권한 없음
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/ServerError' }

  # ───────────────────────────── team ─────────────────────────────
  /api/teams:
    post:
      tags: [team]
      summary: 팀 생성
      description: |
        팀과 팀 계좌를 함께 만들고 요청자를 `LEADER`로 등록한다. 요청자의 `position`도 함께 갱신된다.
        **선행 조건: 학교 인증 완료**(`school_id` + `school_is_verified`) — 미인증이면 403.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, position]
              properties:
                name: { type: string, minLength: 2, maxLength: 50, example: Investars }
                position: { $ref: '#/components/schemas/Position' }
                max_member_count:
                  type: integer
                  minimum: 2
                  maximum: 8
                  default: 4
      responses:
        '201':
          description: 생성됨
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Team' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 학교 인증 필요
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: 이미 팀에 소속됨 / 같은 학교에 동명 팀 존재
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/ServerError' }
    get:
      tags: [team]
      summary: 같은 학교 팀 목록/검색
      description: '**요청자와 같은 학교** 팀만 반환한다. `page`는 없다(limit만).'
      parameters:
        - name: keyword
          in: query
          schema: { type: string, maxLength: 50 }
          description: 팀명 부분 일치
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/TeamListItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 학교 인증 필요
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/teams/join:
    post:
      tags: [team]
      summary: 팀 가입
      description: '가입 코드(8자)로 참여한다. **같은 학교 팀만** 가능. 요청자의 `position`도 함께 갱신된다.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [join_code, position]
              properties:
                join_code:
                  type: string
                  minLength: 8
                  maxLength: 8
                  description: 대문자로 정규화되어 처리된다
                  example: A1B2C3D4
                position: { $ref: '#/components/schemas/Position' }
      responses:
        '200':
          description: 가입 완료 (팀 상세 반환)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Team' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 학교 인증 필요 / 다른 학교의 팀
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: 유효하지 않은 가입 코드
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: 이미 팀 소속 / 정원 초과
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/teams/me:
    get:
      tags: [team]
      summary: 내 팀 조회
      description: |
        ⚠️ `members[]`에는 팀 내 권한인 `role`(LEADER/MEMBER)만 있고
        투자 포지션 `position`(TRADER/ANALYST)은 없다 (api-catalog.md 백로그 P2 참조).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Team' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: 소속된 팀이 없음
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/teams/me/account:
    get:
      tags: [team, account]
      summary: 팀 계좌 요약 + 보유종목 (TH-01/TT-01)
      description: |
        응답 스키마가 `GET /api/accounts/me`와 **완전히 동일**하다 —
        프론트 상단 Scope 토글(개인↔팀)에서 같은 컴포넌트를 재사용하도록 일부러 맞췄다.
      responses:
