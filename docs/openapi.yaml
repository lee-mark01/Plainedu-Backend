      parameters:
        - $ref: '#/components/parameters/ShortformId'
      responses:
        '200':
          description: '레거시 응답 — `data` 없이 `{ success, message }`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageOnly' }
              example:
                success: true
                message: 시청 완료 처리되었습니다.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: 존재하지 않는 숏폼 (`SHORTFORM_NOT_FOUND`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/learning/shortforms/{shortformId}/like:
