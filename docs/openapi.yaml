          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/stocks/{symbol}/chart:
    get:
      tags: [stock]
      summary: 시세 차트
      description: |
        Twelve Data `time_series` + Redis 캐시. **차트 데이터는 DB에 저장하지 않는다.**

        `time` 포맷은 Lightweight Charts 입력 규격 그대로다 —
        일봉 이상(`3M`/`1Y`/`5Y`/`ALL`)은 `"YYYY-MM-DD"` 문자열, 분봉(`1D`/`1W`)은 **unix 초(UTC)**.
        변환 없이 `setData()`에 바로 넣을 수 있고, 분봉의 `time`은 Socket.IO 틱의 `timestamp`와 같은 기준이다.

        **과거 드래그(lazy 로딩)** 는 분봉(`1D`/`1W`)만 지원한다 —
        보유한 가장 오래된 봉의 `time`을 `before`로 넘기면 그 이전 구간을 반환한다(중복 제거됨).

        소수 반올림은 프론트 담당(백엔드는 원시 숫자 유지). `high`/`low`는 요청 구간의 최고/최저.
      security: []
      parameters:
        - $ref: '#/components/parameters/Symbol'
        - name: range
          in: query
          schema:
            type: string
            enum: ['1D', '1W', '3M', '1Y', '5Y', 'ALL']
            default: '1D'
        - name: before
          in: query
          schema: { type: integer, minimum: 1 }
          description: '분봉 lazy 로딩 기준점 (unix 초). 일봉 이상에서는 불필요.'
          example: 1783026900
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Chart' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404':
          description: 존재하지 않는 심볼
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: 외부 시세 제공사 크레딧 소진
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '502':
          description: 외부 시세 제공사 오류
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: 외부 시세 제공사 연결 실패
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

