          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200': { $ref: '#/components/responses/StockListOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/community/posts/{post_id}/comments:
    post:
      tags: [community]
      summary: 댓글 작성
      description: |
        `parent_id`를 주면 대댓글이 된다(2단까지). 게시글 `comment_count`가 +1 된다.
        알림: 대댓글이면 부모 댓글 작성자에게 `COMMENT_REPLY`, 아니면 게시글 작성자에게 `POST_COMMENT`.
      parameters:
        - $ref: '#/components/parameters/PostIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string, example: 좋은 분석 감사합니다 }
                parent_id:
                  type: integer
                  nullable: true
                  description: 대댓글일 때 부모 댓글 id
