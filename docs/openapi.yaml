              properties:
                stock_code:
                  type: string
                  maxLength: 20
                  description: 대문자로 정규화되어 처리된다
                  example: AAPL
      responses:
        '201':
          description: 등록됨
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Stock' }
        '400':
          description: 존재하지 않거나 거래 불가(ACTIVE 아님) 종목 / 검증 실패
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: 이미 등록된 관심종목
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/stocks/watchlist/{stock_code}:
    delete:
      tags: [stock]
      summary: 관심종목 해제
      parameters:
        - name: stock_code
          in: path
          required: true
