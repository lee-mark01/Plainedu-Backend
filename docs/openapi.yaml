                title: { type: string, minLength: 1 }
                content: { type: string, minLength: 1 }
                opinion: { $ref: '#/components/schemas/Opinion' }
      responses:
        '200':
          description: 수정된 게시글
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Post' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
    delete:
      tags: [community]
      summary: 게시글 삭제 (소프트 삭제)
      parameters:
        - $ref: '#/components/parameters/PostIdPath'
      responses:
        '200':
          description: '레거시 응답 — `data` 없이 `{ success, message }`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageOnly' }
              example:
                success: true
                message: 게시글이 삭제되었습니다.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/community/stocks/search:
    get:
      tags: [community]
      summary: 게시글 작성용 종목 검색
      description: '`GET /api/stocks/search`와 동일한 데이터를 반환한다(커뮤니티 화면 전용 경로).'
      security: []
      parameters:
        - name: keyword
