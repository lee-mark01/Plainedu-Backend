                    properties:
                      data:
                        type: object
                        properties:
                          stock_code: { type: string, example: AAPL }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: 관심종목에 없는 종목
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/stocks/{symbol}/chart:
    get:
      tags: [stock]
      summary: 시세 차트
      description: |
        Twelve Data `time_series` + Redis 캐시. **차트 데이터는 DB에 저장하지 않는다.**

        `time` 포맷은 Lightweight Charts 입력 규격 그대로다 —
        일봉 이상(`3M`/`1Y`/`5Y`/`ALL`)은 `"YYYY-MM-DD"` 문자열, 분봉(`1D`/`1W`)은 **unix 초(UTC)**.
        변환 없이 `setData()`에 바로 넣을 수 있고, 분봉의 `time`은 Socket.IO 틱의 `timestamp`와 같은 기준이다.

        **과거 드래그(lazy 로딩)** 는 분봉(`1D`/`1W`)만 지원한다 —
        보유한 가장 오래된 봉의 `time`을 `before`로 넘기면 그 이전 구간을 반환한다(중복 제거됨).

        소수 반올림은 프론트 담당(백엔드는 원시 숫자 유지). `high`/`low`는 요청 구간의 최고/최저.
      security: []
      parameters:
        - $ref: '#/components/parameters/Symbol'
        - name: range
          in: query
          schema:
            type: string
            enum: ['1D', '1W', '3M', '1Y', '5Y', 'ALL']
            default: '1D'
        - name: before
          in: query
          schema: { type: integer, minimum: 1 }
          description: '분봉 lazy 로딩 기준점 (unix 초). 일봉 이상에서는 불필요.'
          example: 1783026900
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Chart' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404':
          description: |
            우리가 취급하지 않는 심볼. 형식이 맞아도 Stocks 테이블에 없으면(페어는 core 목록에 없으면)
            외부 API를 호출하지 않고 여기서 끝난다.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: |
            레이트리밋 초과(`RATE_LIMITED`, `Retry-After` 헤더 동봉) 또는 외부 시세 제공사 크레딧 소진.
            `before`를 붙인 요청은 캐시를 우회하므로 한도가 따로, 더 좁게 걸려 있다.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '502':
          description: 외부 시세 제공사 오류
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: 외부 시세 제공사 연결 실패
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/stocks/{symbol}/quote:
    get:
      tags: [stock]
      summary: 현재가 + 등락률
      description: 헤더 초기값용. 이후 갱신은 Socket.IO `price` 이벤트로 받는다.
      security: []
      parameters:
        - $ref: '#/components/parameters/Symbol'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Quote' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404':
          description: |
            우리가 취급하지 않는 심볼. 형식이 맞아도 Stocks 테이블에 없으면(페어는 core 목록에 없으면)
            외부 API를 호출하지 않고 여기서 끝난다.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: |
            레이트리밋 초과(`RATE_LIMITED`, `Retry-After` 헤더 동봉) 또는 외부 시세 제공사 크레딧 소진.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '502':
          description: 외부 시세 제공사 오류
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ──────────────────────────── trading ───────────────────────────
  /api/trading/orders:
    get:
      tags: [trading]
      summary: 내 주문내역 (개인 계좌)
      parameters:
        - $ref: '#/components/parameters/OrderStatus'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { $ref: '#/components/responses/OrderPageOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [trading]
      summary: 주문 생성 (개인 계좌)
      description: |
        - **시장가(MARKET)**: 조회한 현재가로 **즉시 체결**된다(응답 `order.status = COMPLETED`).
        - **지정가(LIMIT)**: 실시간 틱이 들어오는 종목(`REALTIME_SYMBOLS`)에서만 허용된다.
          접수 시점에 이미 크로스면 즉시 체결, 아니면 `PENDING`으로 남아 틱 매칭 엔진이 체결한다.
          실시간 미제공 종목이면 400 `LIMIT_SYMBOL_NOT_SUPPORTED`.
        - 현금/보유수량 부족은 400 `INSUFFICIENT_FUNDS` / `INSUFFICIENT_HOLDINGS`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlaceOrderRequest' }
      responses:
        '201':
          description: 접수됨 (즉시 체결 시에도 201)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PlaceOrderResult' }
        '400':
          description: |
            검증 실패 / 거래 불가 종목 / `LIMIT_SYMBOL_NOT_SUPPORTED` /
            `INSUFFICIENT_FUNDS` / `INSUFFICIENT_HOLDINGS`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/trading/orders/{id}:
    delete:
      tags: [trading]
      summary: 대기(PENDING) 주문 취소
      description: '`FOR UPDATE` 잠금으로 틱 매칭과의 레이스를 막는다. 이미 체결/취소된 주문은 409.'
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: 취소됨
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          id: { type: integer, example: 42 }
                          status: { type: string, example: CANCELED }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 타인의 주문
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: PENDING이 아닌 주문 (`ORDER_NOT_CANCELABLE`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/trading/team/queue:
    get:
      tags: [trading]
      summary: 팀 실행 대기열 (TO-01)
      description: |
        Active MP 대비 종목별 비중 괴리와 전략 준수도(Alignment)를 반환한다 —
        Trader가 어떤 주문을 넣어야 하는지 판단하는 근거.
        **Active MP가 없으면** 전 필드 `null` + 빈 `items`로 200을 반환한다(404 아님).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ExecutionQueue' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 소속된 팀이 없음
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/trading/team/orders:
    get:
      tags: [trading]
      summary: 팀 주문 내역 (TO-03)
      description: 팀원이면 포지션과 무관하게 조회 가능.
      parameters:
        - $ref: '#/components/parameters/OrderStatus'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { $ref: '#/components/responses/OrderPageOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 소속된 팀이 없음
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [trading]
      summary: 팀 계좌 주문 실행 (TO-02)
      description: |
        요청 body와 체결 규칙은 개인 주문과 동일하고, 대상 계좌만 팀 계좌다.
        **Trader 포지션만 실행할 수 있다** — 아니면 403 `TRADER_ONLY` (TO-04).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlaceOrderRequest' }
      responses:
        '201':
          description: 접수됨
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PlaceOrderResult' }
        '400':
          description: |
            검증 실패 / 거래 불가 종목 / `LIMIT_SYMBOL_NOT_SUPPORTED` /
            `INSUFFICIENT_FUNDS` / `INSUFFICIENT_HOLDINGS`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 소속된 팀이 없음 / Trader가 아님 (`TRADER_ONLY`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/ServerError' }

  # ──────────────────────────── account ───────────────────────────
  /api/accounts/me:
    get:
      tags: [account]
      summary: 내 계좌 요약 + 보유종목 평가손익
      description: |
        **요청할 때마다 즉석 계산**한다(랭킹 점수와 계산 시점이 다르다 — ranking-api.md §4 참조).
        계좌가 없으면 자동 생성 후 정상 응답한다(500 없음).

        가격은 Redis 틱(`price:{symbol}`, TTL 60초) → 실패 시 `getQuote` 폴백 순으로 조회한다.
        **끝내 실패한 종목은 평단가로 대체하고 `price_stale: true`** 로 표시되며,
        계좌 단위로는 `has_stale_prices: true`가 된다.
      responses:
        '200': { $ref: '#/components/responses/AccountSummaryOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/accounts/me/history:
    get:
      tags: [account]
      summary: 자산(수익률) 추이 (PI-01)
      description: |
        일일 스냅샷을 오름차순으로 전부 반환한다. **기간 파라미터가 없다** —
        계좌가 시즌 단위(분기 = 90~92일)라 전 구간을 통째로 내리고 1주/1개월 탭은 프론트가 잘라 쓴다.

        오늘 점은 마감 배치(평일 16:05 ET) 전까지 없다 →
        라이브 값이 필요하면 `GET /api/accounts/me`의 `total_equity`를 이어 붙일 것.

        **`season_id`를 주면 그 시즌의 추이**를 반환한다(지난 시즌 결과 화면의 수익률 선그래프).
        시즌 id 목록은 `GET /api/ranking/seasons`. 그 시즌에 참여하지 않았으면
        404가 아니라 `account_id: null` + 빈 `items`로 200이다 — 그래프가 비는 게 정상 상태.
      parameters:
        - name: season_id
          in: query
          schema: { type: integer, minimum: 1 }
          description: 생략 시 현재 시즌
      responses:
        '200': { $ref: '#/components/responses/AssetHistoryOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  # ─────────────────────────── portfolio ──────────────────────────
  /api/portfolios:
    get:
      tags: [portfolio]
      summary: MP 홈 (Active + Draft + Pending + Archived)
      description: '`drafts`는 **내가 쓴 것만** 보인다. 다른 팀원의 Draft는 노출되지 않는다.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PortfolioHome' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NoTeam' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [portfolio]
      summary: 새 MP 작성 (Draft 저장 또는 바로 제출)
      description: |
        `status: "PENDING"`으로 바로 제출할 때만 **비중 합계 100% 검증**을 한다
        (400 `INVALID_ALLOCATION_SUM`). Draft 저장은 미완성 상태도 허용.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePortfolioRequest' }
      responses:
        '201':
          description: 생성됨
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PortfolioIdStatus' }
        '400':
          description: 검증 실패 / 비중 합계 ≠ 100% (`INVALID_ALLOCATION_SUM`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NoTeam' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/portfolios/active:
    get:
      tags: [portfolio]
      summary: Active MP 상세 + 전략 준수도(Alignment)
      description: |
        목표 비중 vs 실제 보유 비중을 비교해 0~100점의 준수도를 계산한다.

        ```
        CurrentWeight_i = (현재가_i × 수량_i) / TotalValue × 100
        Tolerance_i     = TargetWeight_i × 0.02
        Diff_i          = max(0, |CurrentWeight_i − TargetWeight_i| − Tolerance_i)
        Alignment       = clamp(100 × (1 − ΣDiff / 200), 0, 100)
        ```

        종목별 `status`: 괴리 ≤ 목표×5% `NORMAL` · ~10% `CAUTION` · 초과 `WARNING`.
        목표에 없는 보유 종목도 Target=0%로 포함된다.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ActivePortfolio' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NoTeam' }
        '404':
          description: 운용 중인 모델포트폴리오가 없음
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/portfolios/{id}:
    get:
      tags: [portfolio]
      summary: MP 상세 (allocations + votes)
      parameters:
        - $ref: '#/components/parameters/PortfolioId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PortfolioDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NoTeam' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
    put:
      tags: [portfolio]
      summary: Draft MP 수정
      description: |
        **본인이 작성한 `DRAFT`만** 수정 가능.
        `allocations`를 보내면 기존 종목 구성을 **전부 교체**한다(부분 수정 아님).
      parameters:
        - $ref: '#/components/parameters/PortfolioId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdatePortfolioRequest' }
      responses:
        '200':
          description: 수정됨
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PortfolioIdStatus' }
        '400':
          description: 검증 실패 / DRAFT가 아닌 MP 수정 시도
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 소속된 팀이 없음 / 타인이 작성한 MP
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
    delete:
      tags: [portfolio]
      summary: Draft MP 삭제
      description: '**본인이 작성한 `DRAFT`만** 삭제 가능.'
      parameters:
        - $ref: '#/components/parameters/PortfolioId'
      responses:
        '200':
          description: 삭제됨
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          id: { type: integer, example: 12 }
        '400':
          description: DRAFT가 아닌 MP 삭제 시도
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 소속된 팀이 없음 / 타인이 작성한 MP
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/portfolios/{id}/submit:
    post:
      tags: [portfolio]
      summary: Draft → PENDING 제출
      description: |
        제출 조건(미충족 시 400): 제목 · 투자 근거(description) · 종목 1개 이상 · **비중 합계 정확히 100%**.
      parameters:
        - $ref: '#/components/parameters/PortfolioId'
      responses:
        '200':
          description: 제출됨
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PortfolioIdStatus' }
        '400':
          description: 제출 조건 미충족 (비중 합계는 `INVALID_ALLOCATION_SUM`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 소속된 팀이 없음 / 타인이 작성한 MP
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/portfolios/{id}/votes:
    post:
      tags: [portfolio]
      summary: MP 투표 (찬성/반대)
      description: |
        같은 팀의 `PENDING` MP에만, 1인 1표.
        **과반수 찬성 → 자동 `APPROVED` + Active MP 등록**(기존 Active는 `ARCHIVED`).
        **과반수 반대 → 자동 `REJECTED`.**
        응답의 `status`가 바뀌어 있으면 이 투표로 결론이 난 것이다.
      parameters:
        - $ref: '#/components/parameters/PortfolioId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [is_approved]
              properties:
                is_approved: { type: boolean, example: true }
      responses:
        '201':
          description: 투표 반영됨
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/VoteResult' }
        '400':
          description: 검증 실패 / PENDING이 아닌 MP에 투표
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 소속된 팀이 없음 / 다른 팀의 MP
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 이미 투표함
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/ServerError' }
    get:
      tags: [portfolio]
      summary: 투표 현황 (투표자 목록 포함)
      parameters:
        - $ref: '#/components/parameters/PortfolioId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/VoteStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NoTeam' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  # ──────────────────────────── ranking ───────────────────────────
  /api/ranking/individual:
    get:
      tags: [ranking]
      summary: 개인 리더보드 (%)
      description: |
        점수 = PersonalScore(수익률 %). 동점은 2차 참여율 → 3차 출석일로 재정렬한다.

        **고교/대학 리그는 완전히 분리**되어 있고, 그룹은 서버가 요청 유저의 학교로 자동 판별한다
        (프론트에 그룹 선택 UI 불필요 — 응답 `school_group` 표시).
        **학교 미설정 유저는 어느 리그에도 없다** → 빈 목록 + `school_group: null`.

        순위판(Redis ZSET)이 아직 계산되지 않았으면 빈 목록 + `updated_at: null`.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/RankingLimit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/IndividualLeaderboard' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/ranking/teams:
    get:
      tags: [ranking]
      summary: 팀 리더보드 (Point)
      description: |
        `team_score = R% × 0.9 + Alignment × 0.1` (소수 1자리).
        Alignment는 **금요일 종가 기준 주간 확정값**이고, Active MP가 없는 팀은 0이다.

        ⚠️ 응답에 `alignment` 필드는 **없다**. 필요하면 `(team_score − r_percent × 0.9) / 0.1`로 역산할 것.
        동점은 공동 순위(1-2-2-4식).

        **`school_id`를 주면 그 학교의 참여팀만** 반환한다(소속 리더보드에서 학교를 눌렀을 때).
        이때도 `rank`는 **학교 내 등수가 아니라 리그 전체 순위**이며, `pagination.total`은 필터 후 팀 수다.
        응답 최상위에 `school_id`가 추가로 실린다.
      parameters:
        - name: school_id
          in: query
          schema: { type: integer, minimum: 1 }
          description: 지정 시 해당 학교의 참여팀만 (리그 전체 순위는 유지)
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/RankingLimit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/TeamLeaderboard' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/ranking/schools:
    get:
      tags: [ranking]
      summary: 소속(학교) 리더보드
      description: |
        `OrgScore = Σ(구성원점수 × 참여율) / Σ(참여율)` — 단순평균이 아니라 **참여율 가중평균**이다.
        Σ참여율이 0인 학교는 순위에서 제외된다.

        - `mode=individual` → 구성원=학생, 점수=PersonalScore, `unit: "%"`
        - `mode=team` → 구성원=팀, 점수=TeamScore, 가중치=팀 참여율(팀원 출석 평균), `unit: "Point"`

        `score`의 단위는 항상 응답의 `unit`을 따를 것. 동점은 공동 순위.
      parameters:
        - name: mode
          in: query
          schema:
            type: string
            enum: [individual, team]
            default: individual
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/RankingLimit'
      x-related: '학교를 눌러 참여팀을 보려면 `GET /api/ranking/teams?school_id=`'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/SchoolLeaderboard' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/ranking/me:
    get:
      tags: [ranking]
      summary: 내 순위 요약 (개인 + 팀 + 소속 2종)
      description: |
        **`null`의 의미를 구분할 것:**
        - 섹션 전체가 `null` → 대상 자체가 없음 (무소속 팀 / 학교 미설정)
        - 섹션 객체는 있는데 `rank`·`score`가 `null` → 대상은 있으나 아직 순위판에 없음(미계산·신규)

        `team !== null`만 보고 `rank`를 그대로 쓰면 안 된다.
        `rank_change`는 4개 섹션 전부에 포함된다. `updated_at`은 /me에 없으니 리더보드를 참조할 것.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/MyRanking' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/ranking/me/history:
    get:
      tags: [ranking]
      summary: 내 순위 추이 (그래프)
      description: |
        일자별 순위·점수를 시간순으로 반환한다 — **지난 시즌 결과 화면의 순위 선그래프**용.
        라이브 순위판(ZSET)에는 "오늘 값" 하나뿐이라 추이가 없다 → 영구 기록인
        `DailyRankings`(평일 16:05 ET 스냅샷)를 읽으므로 **시즌이 끝나도 남는다**.

        - `season_id` 생략 시 현재 시즌. 지난 시즌은 `GET /api/ranking/seasons`로 id를 얻어 넘긴다.
        - `total`은 그날 같은 리그의 전체 모수 → `rank / total`로 "상위 N%"를 만들 수 있다.
        - 수익률 선그래프는 이 API가 아니라 `GET /api/accounts/me/history?season_id=`를 쓴다
          (자산 스냅샷이 더 촘촘하고 금액도 함께 준다). 두 그래프를 겹쳐 그리면 디자인의 2선 차트가 된다.
        - **대상이 없으면 빈 `items`로 200**: 학교 미설정(`school_group: null`) · `scope=team`인데 팀 미소속.
      parameters:
        - name: season_id
          in: query
          schema: { type: integer, minimum: 1 }
          description: 생략 시 현재 시즌
        - name: scope
          in: query
          schema:
            type: string
            enum: [individual, team, school_individual, school_team]
            default: individual
          description: 어느 보드의 추이인지 (개인 / 팀 / 개인 소속 / 팀 소속)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/RankHistory' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: 존재하지 않는 시즌
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/ranking/seasons:
    get:
      tags: [ranking]
      summary: 시즌 목록
      description: |
        전 시즌을 최신순으로 반환한다 — 지난 시즌 결과 화면의 **화살표 내비게이션**용.
        여기서 얻은 `season_id`를 `/api/ranking/me/history`·`/api/accounts/me/history`에 넘긴다.
        `is_current: true`가 현재 진행 중인 시즌(= `status: ACTIVE`, 항상 최대 1개).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          seasons:
                            type: array
                            items: { $ref: '#/components/schemas/SeasonListItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/ranking/season:
    get:
      tags: [ranking]
      summary: 현재 시즌 기간 · D-day
      description: |
        시즌은 **분기 단위**(연 4회) — 1/4/7/10월 1일 시작 ~ 그 분기 마지막 날 종료, 이름은 `"2026년 3분기"`.

        종료일이 지난 시즌은 **다음 조회 요청에서 자동으로 닫히고 현재 분기 시즌이 열린다**
        (전용 스케줄러 없음). 시즌이 바뀌면 계좌도 새로 발급되므로 자산·순위가 초기화된 것처럼 보인다.
        `total_days`는 분기 길이라 90~92로 달라진다.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Season' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  # ──────────────────────────── system ────────────────────────────
  /api-docs.json:
    get:
      tags: [system]
      summary: 이 OpenAPI 스펙 (JSON)
      description: |
        `docs/openapi.yaml`을 JSON으로 변환해 그대로 내려준다.
        Postman 임포트·클라이언트 코드젠용. 사람이 볼 문서는 `/api-docs`(Swagger UI).
      security: []
      responses:
        '200':
          description: OpenAPI 3.0 문서
          content:
            application/json:
              schema: { type: object }

  /api/health:
    get:
      tags: [system]
      summary: 헬스체크
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageOnly' }
              example:
                success: true
                message: Server is running

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: '`POST /api/auth/{provider}` 또는 `/api/auth/refresh`가 발급한 accessToken (기본 만료 15분).'

  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    RankingLimit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    HotLimit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
    Cursor:
      name: cursor
      in: query
      schema: { type: integer }
      description: 마지막으로 받은 게시글 id. 생략 시 첫 페이지.
    OrderStatus:
      name: status
      in: query
      schema: { $ref: '#/components/schemas/OrderStatus' }
    TopicId:
      name: topicId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    ShortformId:
      name: shortformId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    QuizId:
      name: quizId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    PostIdPath:
      name: id
      in: path
      required: true
      schema: { type: integer }
    PostIdParam:
      name: post_id
      in: path
      required: true
      schema: { type: integer }
    CommentId:
      name: comment_id
      in: path
      required: true
      schema: { type: integer }
    UserIdParam:
      name: user_id
      in: path
      required: true
      schema: { type: integer }
    PortfolioId:
      name: id
      in: path
      required: true
      schema: { type: integer }
    Symbol:
      name: symbol
      in: path
      required: true
      description: |
        미국 주식(`AAPL`, `BRK.B`) 또는 크립토/외환 페어(`BTC/USD`, `EUR/USD`).
        **페어의 슬래시는 반드시 `%2F`로 URL 인코딩**할 것 (`encodeURIComponent`). 인코딩 없이 보내면 404.
      schema:
        type: string
        pattern: '^[A-Za-z0-9.]{1,12}(/[A-Za-z0-9.]{1,12})?$'
      example: AAPL

  responses:
    BadRequest:
      description: 요청 형식/값 오류 (Joi 검증 실패 포함 — `message`에 첫 번째 에러 메시지)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            success: false
            message: 닉네임을 입력해주세요.
    Unauthorized:
      description: 인증 실패 (`TOKEN_EXPIRED` → refresh 시도 / `TOKEN_INVALID` → 재로그인)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            success: false
            message: 토큰이 만료되었습니다.
            code: TOKEN_EXPIRED
    Forbidden:
      description: 인증은 됐으나 권한 없음 (타인 리소스, 선행 조건 미충족)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NoTeam:
      description: 소속된 팀이 없음
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            success: false
            message: 소속된 팀이 없습니다.
    NotFound:
      description: 리소스 없음
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: |
        레이트리밋 초과. `Retry-After` 헤더(초)만큼 기다린 뒤 재시도한다.
        고정 윈도우라 헤더 값은 남은 시간이 아니라 윈도우 길이다(그만큼 기다리면 반드시 풀린다).
      headers:
        Retry-After:
          description: 재시도까지 대기할 초
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            success: false
            message: 요청이 너무 잦습니다. 잠시 후 다시 시도해주세요.
            code: RATE_LIMITED
    ServerError:
      description: 서버 내부 오류 (`code` 없음)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            success: false
            message: 서버 내부 오류가 발생했습니다.

    EmptySuccess:
      description: '레거시 응답 — `data` 없이 `{ success: true }`만 반환'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Success' }

    LoginOk:
      description: 기존 유저 로그인
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Success'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/LoginResult' }
    LoginCreated:
      description: 신규 가입 (첫 로그인)
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Success'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/LoginResult' }

    AccountSummaryOk:
      description: OK
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Success'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/AccountSummary' }
    AssetHistoryOk:
      description: OK
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Success'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/AssetHistory' }
    OrderPageOk:
      description: OK
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Success'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/OrderPage' }
    PostPageOk:
      description: OK
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Success'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/PostPage' }
    StockListOk:
      description: OK
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Success'
              - type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Stock' }
    FollowListOk:
      description: OK
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Success'
              - type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/FollowUser' }

  schemas:
    # ── 봉투 ──
    Success:
      type: object
      required: [success]
      properties:
        success: { type: boolean, enum: [true], example: true }
    MessageOnly:
      type: object
      description: '`data` 없이 `success`+`message`만 내려가는 레거시 응답.'
      required: [success, message]
      properties:
        success: { type: boolean, enum: [true], example: true }
        message: { type: string }
    Error:
      type: object
      required: [success, message]
      properties:
        success: { type: boolean, enum: [false], example: false }
        message:
          type: string
          description: 사람이 읽는 한국어 메시지. 프론트가 그대로 노출해도 된다.
        code:
          type: string
          description: |
            메시지 표시 이상의 분기(리다이렉트·재시도·특정 UI)가 필요한 에러에만 부여된다.
            전체 목록은 api-conventions.md §5.
          example: TOKEN_EXPIRED

    Pagination:
      type: object
      properties:
        page: { type: integer, example: 1 }
        limit: { type: integer, example: 20 }
        total: { type: integer, example: 42 }

    # ── 공통 enum ──
    Position:
      type: string
      enum: [TRADER, ANALYST]
      description: 팀 내 투자 포지션. Trader만 팀 주문을 실행할 수 있다.
    TeamRole:
      type: string
      enum: [LEADER, MEMBER]
    SchoolGroup:
      type: string
      enum: [HIGH_SCHOOL, UNIVERSITY]
      nullable: true
      description: '`null`이면 학교 미설정 → 리그 미참여.'
    OrderType:
      type: string
      enum: [BUY, SELL]
    PriceType:
      type: string
      enum: [MARKET, LIMIT]
    OrderStatus:
      type: string
      enum: [PENDING, COMPLETED, CANCELED, FAILED]
    PostType:
      type: string
      enum: [STOCK_DISCUSSION, GENERAL]
    Opinion:
      type: string
      enum: [BUY, NEUTRAL, SELL]
    PortfolioStatus:
      type: string
      enum: [DRAFT, PENDING, APPROVED, REJECTED, ARCHIVED]
    AlignmentStatus:
      type: string
      enum: [NORMAL, CAUTION, WARNING]

    # ── auth ──
    OAuthCodeRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: 소셜 제공사가 발급한 인가 코드
          example: 'kQx8...'
        redirect_uri:
          type: string
          description: |
            인가 요청에 사용한 콜백 주소. **인가 때 쓴 값과 문자열이 정확히 일치해야 한다**
            (슬래시 유무·포트·http/https 포함). 카카오/구글이 인가와 교환의 값을 대조하므로
            다르면 `400`으로 거부된다.

            생략하면 서버 기본값(`*_REDIRECT_URI` env)을 사용한다 - 브라우저에서
            `GET /auth/{provider}/callback`로 직접 확인할 때의 경로다.
            네이버는 교환 시 이 값을 요구하지 않아 보내도 무시된다.
          example: 'https://app.plainedu.org/auth/callback'
    FirebaseTokenRequest:
      type: object
      required: [idToken]
      properties:
        idToken:
          type: string
          description: Plain edu Firebase 프로젝트가 발급한 ID 토큰
          example: 'eyJhbGciOiJSUzI1NiIs...'
    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string, example: 'a3f1c...' }
    TokenPair:
      type: object
      properties:
        accessToken: { type: string, description: 'JWT. 페이로드 `{ userId, role }`, 기본 만료 15분.' }
        refreshToken: { type: string, description: '랜덤 40바이트 hex. 서버에는 해시만 저장된다.' }
    LoginResult:
      allOf:
        - $ref: '#/components/schemas/TokenPair'
        - type: object
          properties:
            user: { $ref: '#/components/schemas/UserBrief' }

    # ── user ──
    UserBrief:
      type: object
      properties:
        id: { type: integer, example: 1 }
        email: { type: string, format: email, example: plain.123@gmail.com }
        nickname: { type: string, example: 인천인 }
        role: { type: string, example: USER }
    UserBasic:
      allOf:
        - $ref: '#/components/schemas/UserBrief'
        - type: object
          properties:
            school_id: { type: integer, nullable: true, example: 42 }
            school_is_verified: { type: boolean, example: true }
            position:
              allOf: [{ $ref: '#/components/schemas/Position' }]
              nullable: true
    MyProfile:
      type: object
      properties:
        id: { type: integer, example: 1 }
        email: { type: string, format: email, example: plain.123@gmail.com }
        nickname: { type: string, example: 인천인 }
        role: { type: string, example: USER }
        position:
          allOf: [{ $ref: '#/components/schemas/Position' }]
          nullable: true
        provider: { type: string, enum: [kakao, naver, google], example: kakao }
        school:
          type: object
          nullable: true
          description: 학교 미선택 시 `null`
          properties:
            id: { type: integer, example: 42 }
            name: { type: string, example: 연세대학교 }
            is_verified: { type: boolean, example: true }
        agreements:
          type: object
          description: |
            약관/개인정보/마케팅 동의 상태. **동의한 적 없는 항목도 `false`로 항상 내려간다**
            (키가 빠지지 않으므로 프론트가 존재 여부를 확인할 필요 없음).
            `terms`와 `privacy`가 모두 `true`여야 서비스 이용 가능 상태다.
          properties:
            terms: { type: boolean, description: 서비스 이용약관(필수), example: true }
            privacy: { type: boolean, description: 개인정보 처리방침(필수), example: true }
            marketing: { type: boolean, description: 마케팅 수신(선택), example: false }
        phone:
          type: object
          nullable: true
          description: 휴대폰 미등록 시 `null`. 번호는 하이픈 없는 숫자로 저장된다.
          properties:
            number: { type: string, example: '01012345678' }
            is_verified: { type: boolean, example: true }
        team:
          type: object
          nullable: true
          description: 팀 미소속 시 `null`
          properties:
            id: { type: integer, example: 5 }
            name: { type: string, example: Investars }
            role: { $ref: '#/components/schemas/TeamRole' }
        streak:
          type: object
          properties:
            consecutive_days: { type: integer, example: 8 }
            total_learning_days: { type: integer, example: 45 }
        points: { type: integer, example: 2450 }
        league_rank:
          type: integer
          nullable: true
          description: 개인 리그 순위. 순위판 미계산·학교 미설정 시 `null`.
          example: 3
        asset:
          type: object
          nullable: true
          description: 개인계좌 미생성 시 `null`. 활성 시즌 기준.
          properties:
            total_equity: { type: number, example: 107800 }
            return_rate: { type: number, nullable: true, description: '% 단위', example: 8.42 }
            return_amount: { type: number, nullable: true, description: '`total_equity − initial_cash`', example: 7800 }
        created_at: { type: string, format: date-time }

    AttendanceStreak:
      type: object
      description: 필드명이 camelCase다.
      properties:
        consecutiveDays: { type: integer, example: 8 }
        totalLearningDays: { type: integer, example: 45 }
        weeklyChecklist:
          type: array
          description: '이번 주 월~일 고정 7칸. 오늘 이후 날짜는 `attended: false`.'
          items:
            type: object
            properties:
              date: { type: string, example: '2026-08-10' }
              attended: { type: boolean, example: true }
    MonthlyAttendance:
      type: object
      properties:
        year: { type: integer, example: 2026 }
        month: { type: integer, example: 8 }
        attendanceDates:
          type: array
          description: |
            해당 월의 출석 날짜. DB `DATE` 값이 드라이버를 통해 `Date`로 변환되므로
            ISO date-time 문자열로 직렬화된다(`YYYY-MM-DD`가 아님).
          items: { type: string, format: date-time }
        totalDays: { type: integer, description: 해당 월 출석 일수, example: 12 }
        consecutiveDays:
          type: integer
          description: 조회 월과 무관한 **현재 시점** 누적값
          example: 8
        totalLearningDays: { type: integer, example: 45 }

    # ── school ──
    School:
      type: object
      properties:
        id: { type: integer, example: 42 }
        school_name: { type: string, example: 연세대학교 }
        region: { type: string, example: 서울 }
    SchoolSyncResult:
      type: object
      properties:
        totalFetched: { type: integer, example: 2500 }
        totalInserted: { type: integer, example: 2500 }
        totalInDb: { type: integer, example: 2843 }
        elapsedMs: { type: integer, example: 18342 }
        details:
          type: array
          items:
            type: object
            properties:
              gubun: { type: string, example: high_list }
              label: { type: string, example: 고등학교 }
              fetched: { type: integer, example: 2372 }
              inserted: { type: integer, example: 2372 }

    # ── team ──
    Team:
      type: object
      description: 팀 상세 (Teams 행 + 멤버 목록)
      properties:
        id: { type: integer, example: 5 }
        school_id: { type: integer, example: 42 }
        name: { type: string, example: Investars }
        join_code: { type: string, example: A1B2C3D4 }
        max_member_count: { type: integer, example: 4 }
        current_member_count: { type: integer, example: 2 }
        created_at: { type: string, format: date-time }
        members:
          type: array
          items: { $ref: '#/components/schemas/TeamMember' }
    TeamMember:
      type: object
      properties:
        user_id: { type: integer, example: 1 }
        role: { $ref: '#/components/schemas/TeamRole' }
        joined_at: { type: string, format: date-time }
        nickname: { type: string, example: 김투자 }
    TeamListItem:
      type: object
      properties:
        id: { type: integer, example: 5 }
        name: { type: string, example: Investars }
        current_member_count: { type: integer, example: 2 }
        max_member_count: { type: integer, example: 4 }

    # ── learning ──
    LearningHome:
      type: object
      description: 필드명이 camelCase다.
      properties:
        levelNumber: { type: integer, example: 1 }
        topics:
          type: array
          items:
            type: object
            properties:
              id: { type: integer, example: 3 }
              title: { type: string, example: 주식 기본 개념 }
              levelNumber: { type: integer, example: 1 }
              sortOrder: { type: integer, example: 0 }
              shortformProgress:
                type: object
                properties:
                  total: { type: integer, example: 5 }
                  completed: { type: integer, example: 5 }
              quizProgress:
                type: object
                properties:
                  total: { type: integer, example: 4 }
                  correct: { type: integer, example: 3 }
              isShortformDone: { type: boolean, example: true }
              isQuizDone: { type: boolean, example: false }
        todayFlow:
          type: object
          description: '오늘 완료한 학습 단계 수. 매일 0으로 자동 초기화. 3단계 중 모의투자(3단계)는 MVP 미구현이라 항상 0으로 집계된다.'
          properties:
            completedSteps: { type: integer, example: 2 }
            totalSteps: { type: integer, example: 3 }
        level:
          type: object
          description: '레벨 기준 — 총 학습일 7/20/50/100일에서 각각 2·3·4·5레벨.'
          properties:
            current: { type: integer, example: 2 }
            totalLearningDays: { type: integer, example: 12 }
            consecutiveDays: { type: integer, example: 3 }
    ShortformList:
      type: object
      properties:
        topicId: { type: integer, example: 3 }
        topicTitle: { type: string, example: 주식 기본 개념 }
        shortforms:
          type: array
          items:
            type: object
            properties:
              id: { type: integer, example: 11 }
              title: { type: string, example: 주식이란 무엇인가 }
              description: { type: string, nullable: true }
              videoUrl: { type: string, example: 'https://cdn.example.com/sf/11.mp4' }
              sortOrder: { type: integer, example: 0 }
              isCompleted: { type: boolean, example: true }
              isLiked: { type: boolean, example: false }
              isSaved: { type: boolean, example: false }
    QuizList:
      type: object
      properties:
        topicId: { type: integer, example: 3 }
        topicTitle: { type: string, example: 주식 기본 개념 }
        quizzes:
          type: array
          items:
            type: object
            properties:
              id: { type: integer, example: 21 }
              type: { type: string, enum: [CHOICE, OX, SHORT, MATCH], example: CHOICE }
              difficulty: { type: string, example: EASY }
              questionData:
                type: object
                description: 문제 본문·선택지 등. 구조는 기획팀 정의를 그대로 노출한다.
                additionalProperties: true
              sortOrder: { type: integer, example: 0 }
    QuizAnswerResult:
      type: object
      properties:
        quizId: { type: integer, example: 21 }
        isCorrect: { type: boolean, example: true }
        answerData:
          type: object
          description: 정답·해설 등. 구조는 기획팀 정의를 그대로 노출한다.
          additionalProperties: true
    QuizSessionResult:
      type: object
      properties:
        topicId: { type: integer, example: 3 }
        topicTitle: { type: string, example: 주식 기본 개념 }
        totalQuestions: { type: integer, example: 4 }
        correctCount: { type: integer, example: 3 }
        score: { type: integer, description: '0~100 정수', example: 75 }
        message: { type: string, example: '좋아요! 조금만 더! 💪' }

    # ── community ──
    CreatePostRequest:
      type: object
      required: [post_type, title, content]
      description: |
        `post_type = STOCK_DISCUSSION`이면 `stock_code`·`opinion`이 **필수**,
        `GENERAL`이면 두 필드는 `null`이어야 한다.
      properties:
        post_type: { $ref: '#/components/schemas/PostType' }
        stock_code: { type: string, nullable: true, example: AAPL }
        opinion:
          allOf: [{ $ref: '#/components/schemas/Opinion' }]
          nullable: true
        title: { type: string, example: 애플 실적 발표 정리 }
        content: { type: string, example: 이번 분기 매출은... }
    Post:
      type: object
      description: 'CommunityPosts 행 전체.'
      properties:
        id: { type: integer, example: 88 }
        user_id: { type: integer, example: 1 }
        post_type: { $ref: '#/components/schemas/PostType' }
        stock_code: { type: string, nullable: true, example: AAPL }
        opinion:
          allOf: [{ $ref: '#/components/schemas/Opinion' }]
          nullable: true
        title: { type: string, example: 애플 실적 발표 정리 }
        content: { type: string }
        view_count: { type: integer, example: 120 }
        like_count: { type: integer, example: 15 }
        comment_count: { type: integer, example: 3 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time, nullable: true }
        deleted_at: { type: string, format: date-time, nullable: true }
    PostPage:
      type: object
      properties:
        posts:
          type: array
          items: { $ref: '#/components/schemas/Post' }
        hasNext:
          type: boolean
          description: '`true`면 마지막 항목의 `id`를 다음 요청의 `cursor`로 넘긴다.'
          example: true
    BookmarkedPost:
      type: object
      properties:
        id: { type: integer, example: 88 }
        title: { type: string, example: KOSPI 전망 }
        post_type: { $ref: '#/components/schemas/PostType' }
        stock_code: { type: string, nullable: true, example: AAPL }
        opinion:
          allOf: [{ $ref: '#/components/schemas/Opinion' }]
          nullable: true
        view_count: { type: integer, example: 120 }
        like_count: { type: integer, example: 15 }
        comment_count: { type: integer, example: 3 }
        created_at: { type: string, format: date-time }
        author_nickname: { type: string, example: 투자왕 }
        bookmarked_at: { type: string, format: date-time }
    Comment:
      type: object
      description: 'CommunityComments 행 전체 (작성/수정 응답).'
      properties:
        id: { type: integer, example: 301 }
        post_id: { type: integer, example: 88 }
        user_id: { type: integer, example: 1 }
        parent_id: { type: integer, nullable: true }
        content: { type: string }
        like_count: { type: integer, example: 0 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time, nullable: true }
        deleted_at: { type: string, format: date-time, nullable: true }
    CommentNode:
      type: object
      description: |
        댓글 트리 노드. `is_deleted: true`면 답글이 남아 자리표시로 내려온 삭제 댓글이라
        `content`·`author_nickname`·`user_id`가 `null`이고 `like_count`는 0이다.
      properties:
        id: { type: integer, example: 301 }
        post_id: { type: integer, example: 88 }
        user_id: { type: integer, nullable: true, example: 1 }
        parent_id: { type: integer, nullable: true }
        content: { type: string, nullable: true }
        author_nickname: { type: string, nullable: true, example: 투자왕 }
        like_count: { type: integer, example: 2 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time, nullable: true }
        is_deleted: { type: boolean, example: false }
        replies:
          type: array
          description: 대댓글 (2단까지)
          items: { $ref: '#/components/schemas/CommentNode' }
    HotStock:
      type: object
      properties:
        stock_code: { type: string, example: AAPL }
        stock_name: { type: string, example: Apple Inc }
        post_count: { type: integer, example: 12 }
        total_comments: { type: integer, example: 34 }
        total_likes: { type: integer, example: 51 }
        score: { type: integer, description: '`post_count + total_comments + total_likes`', example: 97 }
    PopularPost:
      type: object
      properties:
        id: { type: integer, example: 88 }
        user_id: { type: integer, example: 1 }
        post_type: { $ref: '#/components/schemas/PostType' }
        stock_code: { type: string, nullable: true, example: AAPL }
        title: { type: string, example: KOSPI 전망 }
        view_count: { type: integer, example: 120 }
        like_count: { type: integer, example: 15 }
        comment_count: { type: integer, example: 3 }
        created_at: { type: string, format: date-time }
        author_nickname: { type: string, example: 투자왕 }
        score: { type: integer, description: '`like×3 + comment×2 + view`', example: 171 }
    FollowUser:
      type: object
      properties:
        id: { type: integer, example: 7 }
        nickname: { type: string, example: 투자왕 }
        followed_at: { type: string, format: date-time }
    Notification:
      type: object
      properties:
        id: { type: integer, example: 501 }
        type:
          type: string
          enum: [FOLLOWEE_POST, POST_LIKE, POST_COMMENT, COMMENT_REPLY, VOTE_START, PORTFOLIO_CHANGED]
          example: POST_COMMENT
        reference_id:
          type: integer
          nullable: true
          description: 알림 대상 id (게시글 알림이면 post id, 댓글 알림이면 comment id)
        content: { type: string, nullable: true }
        is_read: { type: boolean, example: false }
        created_at: { type: string, format: date-time }
        sender_nickname: { type: string, example: 투자왕 }

    # ── stock ──
    Stock:
      type: object
      properties:
        stock_code: { type: string, example: AAPL }
        name: { type: string, example: Apple Inc }
        market: { type: string, example: NASDAQ }
    WatchlistItem:
      allOf:
        - $ref: '#/components/schemas/Stock'
        - type: object
          properties:
            created_at: { type: string, format: date-time, description: 관심종목 등록 시각 }
            price: { type: number, nullable: true, example: 260.58 }
            change: { type: number, nullable: true, example: 2.48 }
            changePercent: { type: number, nullable: true, example: 0.96 }
    Candle:
      type: object
      properties:
        time:
          oneOf:
            - type: string
              description: '일봉 이상(`3M`/`1Y`/`5Y`/`ALL`) — `"YYYY-MM-DD"`'
            - type: integer
              description: '분봉(`1D`/`1W`) — unix 초(UTC)'
          example: '2026-02-19'
        open: { type: number, example: 262.6 }
        high: { type: number, example: 264.48 }
        low: { type: number, example: 260.05 }
        close: { type: number, example: 260.58 }
        volume:
          type: integer
          nullable: true
          description: 외환은 거래량이 없어 `null`
          example: 30845300
    Chart:
      type: object
      properties:
        symbol: { type: string, example: AAPL }
        interval: { type: string, example: 1day }
        range: { type: string, example: 1Y }
        currency: { type: string, example: USD }
        timezone: { type: string, example: America/New_York }
        exchange: { type: string, example: NASDAQ }
        candles:
          type: array
          items: { $ref: '#/components/schemas/Candle' }
        high: { type: number, description: 요청 구간 최고가, example: 317.4 }
        low: { type: number, description: 요청 구간 최저가, example: 245.51 }
    Quote:
      type: object
      properties:
        symbol: { type: string, example: AAPL }
        price: { type: number, example: 260.58 }
        prevClose: { type: number, example: 258.1 }
        change: { type: number, example: 2.48 }
        changePercent: { type: number, example: 0.96 }
        timestamp:
          oneOf:
            - type: integer
              description: '`source = ws` — unix 초(UTC)'
            - type: string
              description: '`source = close` — 거래소 로컬 날짜 문자열'
          example: '2026-07-03'
        source:
          type: string
          enum: [ws, close]
          description: '`ws` = 장중 실시간 틱, `close` = 마지막 일봉 종가'
        marketOpen:
          type: boolean
          description: 크립토/외환(24/7)은 항상 `true`
          example: false

    # ── trading ──
    PlaceOrderRequest:
      type: object
      required: [stock_code, order_type, price_type, order_quantity]
      properties:
        stock_code:
          type: string
          maxLength: 20
          description: 대문자로 정규화되어 처리된다
          example: AAPL
        order_type: { $ref: '#/components/schemas/OrderType' }
        price_type: { $ref: '#/components/schemas/PriceType' }
        order_quantity:
          type: number
          exclusiveMinimum: true
          minimum: 0
          description: 소수 4자리까지
          example: 10
        order_price:
          type: number
          exclusiveMinimum: true
          minimum: 0
          description: |
            소수 2자리까지. `price_type = LIMIT`일 때 **필수**,
            `MARKET`일 때는 **보내면 안 된다**(Joi `forbidden` → 400).
          example: 255.5
    Order:
      type: object
      properties:
        id: { type: integer, example: 42 }
        trader_id: { type: integer, example: 1 }
        stock_code: { type: string, example: AAPL }
        order_type: { $ref: '#/components/schemas/OrderType' }
        price_type: { $ref: '#/components/schemas/PriceType' }
        order_price: { type: string, nullable: true, description: 'DECIMAL 문자열', example: '255.50' }
        order_quantity: { type: string, description: 'DECIMAL 문자열', example: '10.0000' }
        executed_price: { type: string, nullable: true, example: '260.58' }
        executed_quantity: { type: string, nullable: true, example: '10.0000' }
        status: { $ref: '#/components/schemas/OrderStatus' }
        created_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time, nullable: true }
    OrderPage:
      type: object
      properties:
        orders:
          type: array
          description: 최신순 (id 내림차순)
          items: { $ref: '#/components/schemas/Order' }
        pagination: { $ref: '#/components/schemas/Pagination' }
    PlaceOrderResult:
      type: object
      properties:
        order:
          type: object
          description: 접수된 주문. 즉시 체결이면 `status = COMPLETED`, 아니면 `PENDING`.
          properties:
            id: { type: integer, example: 42 }
            account_id: { type: integer, example: 7 }
            trader_id: { type: integer, example: 1 }
            stock_code: { type: string, example: AAPL }
            order_type: { $ref: '#/components/schemas/OrderType' }
            price_type: { $ref: '#/components/schemas/PriceType' }
            order_price: { type: number, nullable: true, example: 255.5 }
            order_quantity: { type: number, example: 10 }
            status: { $ref: '#/components/schemas/OrderStatus' }
        account:
          type: object
          description: 체결 반영 후 계좌 현금 잔고
          properties:
            id: { type: integer, example: 7 }
            cash_balance: { type: string, description: 'DECIMAL 문자열', example: '97394.20' }
    ExecutionQueue:
      type: object
      description: 'Active MP가 없으면 `portfolio_id`·`title`·`alignment`·`total_diff`가 모두 `null`이고 `items`는 빈 배열.'
      properties:
        portfolio_id: { type: integer, nullable: true, example: 5 }
        title: { type: string, nullable: true, example: IT 대형주 중심 성장 포트폴리오 }
        alignment: { type: number, nullable: true, example: 89.4 }
        total_diff: { type: number, nullable: true, example: 21.2 }
        items:
          type: array
          items: { $ref: '#/components/schemas/AlignmentItem' }

    # ── account ──
    AccountSummary:
      type: object
      properties:
        account:
          type: object
          properties:
            id: { type: integer, example: 7 }
            account_type: { type: string, enum: [INDIVIDUAL, TEAM], example: INDIVIDUAL }
            season_id: { type: integer, example: 1 }
            initial_cash: { type: number, example: 100000 }
            cash_balance: { type: number, example: 97394.2 }
            total_equity: { type: number, example: 107800 }
            return_rate:
              type: number
              nullable: true
              description: '% 단위, 소수 4자리. `initial_cash ≤ 0`이면 `null`.'
              example: 7.8
            cash_weight:
              type: number
              nullable: true
              description: '현금 비중 %. `total_equity ≤ 0`이면 `null`.'
              example: 90.3441
            has_stale_prices:
              type: boolean
              description: '`true`면 시세 조회에 실패해 평단가로 대체한 보유 종목이 있다 → 프론트에 신선도 배지 노출 권장.'
              example: false
        holdings:
          type: array
          items: { $ref: '#/components/schemas/Holding' }
    Holding:
      type: object
      properties:
        stock_code: { type: string, example: AAPL }
        quantity: { type: number, example: 10 }
        average_buy_price: { type: number, example: 255.5 }
        current_price:
          type: number
          description: '`price_stale: true`면 평단가로 대체된 값.'
          example: 260.58
        price_stale: { type: boolean, example: false }
        value: { type: number, description: '`current_price × quantity`', example: 2605.8 }
        pnl: { type: number, description: 평가손익, example: 50.8 }
        pnl_rate: { type: number, nullable: true, description: '% 단위. 매입금액이 0이면 `null`.', example: 1.9883 }
        weight: { type: number, nullable: true, description: '총자산 대비 비중 %. `total_equity ≤ 0`이면 `null`.', example: 2.4173 }
        price_source:
          type: string
          enum: [ws, close]
          nullable: true
          description: '시세 출처. stale 보유는 `null`.'
        priced_at:
          type: string
          nullable: true
          description: |
            시세 기준 시점. `price_source = ws`면 ISO date-time,
            `close`면 거래일 문자열(`YYYY-MM-DD`). stale 보유는 `null`.
          example: '2026-07-03'
    AssetHistory:
      type: object
      properties:
        account_id:
          type: integer
          nullable: true
          description: '요청한 시즌에 참여하지 않았으면 `null` (items도 빈 배열)'
          example: 7
        season_id: { type: integer, example: 1 }
        items:
          type: array
          description: 날짜 오름차순 (그래프 x축 순서)
          items:
            type: object
            properties:
              date: { type: string, example: '2026-07-19' }
              total_equity: { type: number, example: 101234.56 }
              return_rate: { type: number, example: 1.2346 }

    # ── portfolio ──
    Allocation:
      type: object
      properties:
        stock_code: { type: string, example: AAPL }
        stock_name: { type: string, example: Apple Inc }
        target_percentage: { type: number, example: 40 }
        reason: { type: string, nullable: true, example: AI 인프라 핵심 기업 }
    AllocationInput:
      type: object
      required: [stock_code, target_percentage]
      properties:
        stock_code: { type: string, maxLength: 20, example: AAPL }
        target_percentage: { type: number, minimum: 0, maximum: 100, example: 40 }
        reason: { type: string, maxLength: 2000, nullable: true }
    AlignmentItem:
      type: object
      properties:
        stock_code: { type: string, example: AAPL }
        target_weight: { type: number, description: '목표 비중 %', example: 40 }
        current_weight: { type: number, description: '현재 실제 비중 %', example: 35.8 }
        diff: { type: number, description: '`current − target` (양수=초과, 음수=부족)', example: -4.2 }
        raw_diff: { type: number, description: 절대 괴리, example: 4.2 }
        status: { $ref: '#/components/schemas/AlignmentStatus' }
    PortfolioSummary:
      type: object
      properties:
        id: { type: integer, example: 8 }
        title: { type: string, nullable: true, example: 미래 성장 산업 분산 포트폴리오 }
        status: { $ref: '#/components/schemas/PortfolioStatus' }
        proposer_nickname: { type: string, example: 최애널 }
        created_at: { type: string, format: date-time }
        allocations:
          type: array
          items: { $ref: '#/components/schemas/Allocation' }
    PortfolioHome:
      type: object
      properties:
        active:
          type: object
          nullable: true
          description: 운용 중인 Active MP. 없으면 `null`.
          properties:
            team_id: { type: integer, example: 1 }
            portfolio_id: { type: integer, example: 5 }
            title: { type: string, example: IT 대형주 중심 성장 포트폴리오 }
            proposer_nickname: { type: string, example: 김투자 }
            activated_at: { type: string, format: date-time }
            allocations:
              type: array
              items: { $ref: '#/components/schemas/Allocation' }
        drafts:
          type: array
          description: '**내가 작성한** Draft만'
          items: { $ref: '#/components/schemas/PortfolioSummary' }
        pending:
          type: array
          description: 팀 전체가 투표 중인 MP
          items: { $ref: '#/components/schemas/PortfolioSummary' }
        archived:
          type: array
          description: 과거에 운용했던 MP 이력
          items: { $ref: '#/components/schemas/PortfolioSummary' }
    ActivePortfolio:
      type: object
      properties:
        team_id: { type: integer, example: 1 }
        portfolio_id: { type: integer, example: 5 }
        title: { type: string, example: IT 대형주 중심 성장 포트폴리오 }
        description: { type: string, nullable: true }
        analysis: { type: string, nullable: true }
        proposer_nickname: { type: string, example: 김투자 }
        activated_at: { type: string, format: date-time }
        allocations:
          type: array
          items: { $ref: '#/components/schemas/Allocation' }
        alignment: { type: number, description: '전략 준수도 0~100 (높을수록 목표에 근접)', example: 89.4 }
        total_diff: { type: number, description: '총 괴리도 (낮을수록 좋음)', example: 21.2 }
        alignment_items:
          type: array
          items: { $ref: '#/components/schemas/AlignmentItem' }
        account:
          type: object
          description: 팀 계좌 요약
          properties:
            cash_balance: { type: number, example: 500000 }
            total_equity: { type: number, example: 9800000 }
            return_rate: { type: number, nullable: true, example: -2 }
    PortfolioDetail:
      type: object
      properties:
        id: { type: integer, example: 12 }
        team_id: { type: integer, example: 1 }
        type: { type: string, enum: [NEW, REVISION], example: NEW }
        parent_id: { type: integer, nullable: true }
        proposed_by: { type: integer, example: 3 }
        title: { type: string, nullable: true }
        description: { type: string, nullable: true }
        analysis: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/PortfolioStatus' }
        approval_count: { type: integer, example: 2 }
        rejection_count: { type: integer, example: 0 }
        created_at: { type: string, format: date-time }
        allocations:
          type: array
          items: { $ref: '#/components/schemas/Allocation' }
        votes:
          type: array
          items: { $ref: '#/components/schemas/Vote' }
    CreatePortfolioRequest:
      type: object
      properties:
        type:
          type: string
          enum: [NEW, REVISION]
          default: NEW
        parent_id:
          type: integer
          nullable: true
          description: '`REVISION`일 때 원본 MP의 id'
        title: { type: string, maxLength: 100, nullable: true }
        description: { type: string, maxLength: 5000, nullable: true, description: 투자 근거 }
        analysis: { type: string, maxLength: 5000, nullable: true, description: 상세 분석 }
        allocations:
          type: array
          default: []
          items: { $ref: '#/components/schemas/AllocationInput' }
        status:
          type: string
          enum: [DRAFT, PENDING]
          default: DRAFT
          description: '`PENDING`이면 바로 투표에 회부 (비중 합계 100% 검증)'
    UpdatePortfolioRequest:
      type: object
      description: 변경할 필드만 보내면 된다.
      properties:
        title: { type: string, maxLength: 100, nullable: true }
        description: { type: string, maxLength: 5000, nullable: true }
        analysis: { type: string, maxLength: 5000, nullable: true }
        allocations:
          type: array
          description: 보내면 기존 종목 구성을 **전부 교체**한다.
          items: { $ref: '#/components/schemas/AllocationInput' }
    PortfolioIdStatus:
      type: object
      properties:
        id: { type: integer, example: 12 }
        status: { $ref: '#/components/schemas/PortfolioStatus' }
    Vote:
      type: object
      properties:
        voter_id: { type: integer, example: 1 }
        voter_nickname: { type: string, example: 김팀장 }
        is_approved: { type: boolean, example: true }
        created_at: { type: string, format: date-time }
    VoteResult:
      type: object
      properties:
        portfolio_id: { type: integer, example: 12 }
        vote: { type: string, enum: [APPROVE, REJECT], example: APPROVE }
        approval_count: { type: integer, example: 3 }
        rejection_count: { type: integer, example: 0 }
        status:
          allOf: [{ $ref: '#/components/schemas/PortfolioStatus' }]
          description: 이 투표 반영 후의 MP 상태. `APPROVED`/`REJECTED`면 이 표로 결론이 난 것.
    VoteStatus:
      type: object
      properties:
        portfolio_id: { type: integer, example: 12 }
        status: { $ref: '#/components/schemas/PortfolioStatus' }
        approval_count: { type: integer, example: 2 }
        rejection_count: { type: integer, example: 0 }
        votes:
          type: array
          items: { $ref: '#/components/schemas/Vote' }

    # ── ranking ──
    RankChange:
      type: integer
      nullable: true
      description: |
        직전 거래일 스냅샷 대비 순위 변동 (양수=상승, 음수=하락, `0`=변동 없음).
        비교할 과거 스냅샷이 없으면(시즌 첫날·신규 진입) `null`. 주말·공휴일은 건너뛴다.
      example: 2
    LeaderboardMeta:
      type: object
      properties:
        season_id: { type: integer, example: 1 }
        school_group: { $ref: '#/components/schemas/SchoolGroup' }
        updated_at:
          type: string
          format: date-time
          nullable: true
          description: '순위판 마지막 갱신 시각. recompute 미실행이면 `null`("N분 전 기준" 표시 재료).'
        pagination: { $ref: '#/components/schemas/Pagination' }
    IndividualLeaderboard:
      allOf:
        - $ref: '#/components/schemas/LeaderboardMeta'
        - type: object
          properties:
            rankings:
              type: array
              items:
                type: object
                properties:
                  rank: { type: integer, example: 1 }
                  rank_change: { $ref: '#/components/schemas/RankChange' }
                  user_id: { type: integer, example: 1 }
                  nickname: { type: string, example: 홍길동 }
                  school_name: { type: string, nullable: true, example: 테스트고등학교 }
                  score: { type: number, description: 'PersonalScore(%) 소수 4자리', example: 6.7382 }
                  active_days: { type: integer, example: 6 }
                  participation_ratio: { type: number, description: '0~1, 소수 4자리', example: 0.0667 }
    TeamLeaderboard:
      allOf:
        - $ref: '#/components/schemas/LeaderboardMeta'
        - type: object
          properties:
            rankings:
              type: array
              items:
                type: object
                properties:
                  rank: { type: integer, example: 1 }
                  rank_change: { $ref: '#/components/schemas/RankChange' }
                  team_id: { type: integer, example: 4 }
                  team_name: { type: string, example: 검증팀A }
                  school_name: { type: string, nullable: true, example: 테스트고등학교 }
                  team_score: { type: number, description: 'Point, 소수 1자리', example: 10.6 }
                  r_percent: { type: number, description: '팀 계좌 수익률 %', example: 0.6738 }
    SchoolLeaderboard:
      allOf:
        - $ref: '#/components/schemas/LeaderboardMeta'
        - type: object
          properties:
            mode: { type: string, enum: [individual, team], example: team }
            unit:
              type: string
              enum: ['%', Point]
              description: '`score`의 단위. `mode=individual` → `%`, `mode=team` → `Point`.'
              example: Point
            rankings:
              type: array
              items:
                type: object
                properties:
                  rank: { type: integer, example: 1 }
                  rank_change: { $ref: '#/components/schemas/RankChange' }
                  school_id: { type: integer, example: 1 }
                  school_name: { type: string, example: 테스트고등학교 }
                  score: { type: number, example: 10.3 }
    MyRanking:
      type: object
      properties:
        season_id: { type: integer, example: 1 }
        school_group: { $ref: '#/components/schemas/SchoolGroup' }
        individual:
          type: object
          properties:
            rank: { type: integer, nullable: true, example: 1 }
            rank_change: { $ref: '#/components/schemas/RankChange' }
            score: { type: number, nullable: true, example: 6.7382 }
            active_days: { type: integer, example: 6 }
            participation_ratio: { type: number, example: 0.0667 }
        team:
          type: object
          nullable: true
          description: '팀 미소속이면 `null`. 소속은 있으나 순위판 미등재면 객체는 오되 `rank`·`team_score`·`r_percent`가 `null`.'
          properties:
            team_id: { type: integer, example: 4 }
            team_name: { type: string, example: 검증팀A }
            rank: { type: integer, nullable: true, example: 1 }
            rank_change: { $ref: '#/components/schemas/RankChange' }
            team_score: { type: number, nullable: true, example: 10.6 }
            r_percent: { type: number, nullable: true, example: 0.6738 }
            total_teams: { type: integer, example: 3 }
        school_individual:
          allOf: [{ $ref: '#/components/schemas/MySchoolRank' }]
          nullable: true
        school_team:
          allOf: [{ $ref: '#/components/schemas/MySchoolRank' }]
          nullable: true
        total_participants: { type: integer, example: 42 }
    MySchoolRank:
      type: object
      description: '학교 미설정이면 섹션 전체가 `null`. 학교는 있으나 순위판 미등재면 `rank`·`score`만 `null`.'
      properties:
        school_id: { type: integer, example: 1 }
        school_name: { type: string, example: 테스트고등학교 }
        rank: { type: integer, nullable: true, example: 1 }
        rank_change: { $ref: '#/components/schemas/RankChange' }
        score: { type: number, nullable: true, example: 0.438 }
        total_schools: { type: integer, example: 2 }
    SeasonListItem:
      type: object
      properties:
        season_id: { type: integer, example: 2 }
        name: { type: string, example: 2026년 2분기 }
        start_date: { type: string, example: '2026-04-01' }
        end_date: { type: string, example: '2026-06-30' }
        total_days: { type: integer, example: 91 }
        status: { type: string, enum: [UPCOMING, ACTIVE, COMPLETED], example: COMPLETED }
        is_current: { type: boolean, description: '`status === ACTIVE`', example: false }

    RankHistory:
      type: object
      properties:
        season_id: { type: integer, example: 2 }
        season_name: { type: string, example: 2026년 2분기 }
        scope:
          type: string
          enum: [individual, team, school_individual, school_team]
          example: individual
        school_group: { $ref: '#/components/schemas/SchoolGroup' }
        target_id:
          type: integer
          nullable: true
          description: '실제 조회 대상 id (scope에 따라 user_id / team_id / school_id). 대상 없으면 `null`.'
          example: 1
        items:
          type: array
          description: 날짜 오름차순 (그래프 x축 순서). 스냅샷이 없는 날은 점이 없다.
          items:
            type: object
            properties:
              date: { type: string, example: '2026-06-30' }
              rank: { type: integer, description: 그날 리그 내 순위, example: 3 }
              total:
                type: integer
                description: '그날 같은 리그의 전체 모수 → `rank / total` = 상위 N%'
                example: 1284
              score: { type: number, description: '그날 최종 점수 (개인·개인소속 % / 팀·팀소속 Point)', example: 8.42 }
              return_rate: { type: number, description: '수익률 %. 팀 보드는 R%, 팀소속은 Point와 동일값', example: 8.42 }

    Season:
      type: object
      properties:
        season_id: { type: integer, example: 3 }
        name: { type: string, description: '`"YYYY년 N분기"`', example: 2026년 3분기 }
        start_date: { type: string, description: 분기 첫날, example: '2026-07-01' }
        end_date: { type: string, description: 분기 마지막 날, example: '2026-09-30' }
        total_days:
          type: integer
          description: 분기 길이(90~92). 참여율(ParticipationRatio)의 분모.
          example: 92
        status: { type: string, enum: [UPCOMING, ACTIVE, COMPLETED], example: ACTIVE }
        d_day: { type: integer, description: 오늘부터 종료일까지 남은 일수, example: 48 }
