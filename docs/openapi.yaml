            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/ServerError' }

  # ─────────────────────────── learning ───────────────────────────
  /api/learning/topics:
    get:
      tags: [learning]
      summary: 학습 메인 (주제 목록 + 진행현황 + 오늘의 플로우 + 레벨)
      parameters:
        - name: level
          in: query
          schema: { type: integer, minimum: 1, maximum: 10, default: 1 }
          description: 조회할 레벨
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
