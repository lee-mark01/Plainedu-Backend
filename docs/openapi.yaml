  /api/community/posts/{post_id}/comments:
    post:
      tags: [community]
      summary: 댓글 작성
      description: |
        `parent_id`를 주면 대댓글이 된다(2단까지). 게시글 `comment_count`가 +1 된다.
        알림: 대댓글이면 부모 댓글 작성자에게 `COMMENT_REPLY`, 아니면 게시글 작성자에게 `POST_COMMENT`.
      parameters:
        - $ref: '#/components/parameters/PostIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string, example: 좋은 분석 감사합니다 }
                parent_id:
                  type: integer
                  nullable: true
                  description: 대댓글일 때 부모 댓글 id
      responses:
        '201':
          description: 생성됨
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Comment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: 게시글 또는 부모 댓글 없음
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/ServerError' }
    get:
      tags: [community]
      summary: 댓글 목록 (댓글 → 대댓글 2단 트리)
      description: |
        각 노드에 `is_deleted`가 포함된다.
        `true`면 **답글이 남아 있어 자리표시로 내려온 삭제 댓글**이라 `content`·`author_nickname`이 `null`이다
        → 프론트는 "삭제된 댓글입니다"로 렌더할 것.
        답글까지 전부 삭제된 가지는 응답에서 아예 빠진다.
      security: []
      parameters:
        - $ref: '#/components/parameters/PostIdParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/CommentNode' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

