openapi: 3.0.3

info:
  title: Plainedu API
  version: 1.0.0
  description: |
    청소년·대학생 대상 투자 학습/모의투자 서비스 **Plainedu**의 REST API 명세.

    - 이 문서는 [api-catalog.md](api-catalog.md)(전 도메인 API 목록)와 [api-conventions.md](api-conventions.md)(공통 규약)를 OpenAPI로 옮긴 것이다.
    - **API를 추가/변경/삭제한 사람이 같은 PR에서 이 파일과 api-catalog.md를 함께 갱신한다.**
    - 도메인별 상세 배경(산식·생명주기·Open Questions)은 [portfolio-api.md](portfolio-api.md), [ranking-api.md](ranking-api.md), [mypage-api.md](mypage-api.md), [stock-chart.md](stock-chart.md) 참조.

    ## 공통 규약

    **응답 봉투** — 성공 `{ "success": true, "data": ... }` / 실패 `{ "success": false, "message": "...", "code": "..." }`
    (`message`는 항상 한국어 문장이라 프론트가 그대로 노출 가능. `code`는 분기가 필요한 에러에만 부여)

    일부 레거시 엔드포인트는 `data` 없이 `{ success: true }` 또는 `{ success: true, message }`만 반환한다 —
    각 응답 스키마에 표기해 두었으니 프론트와 합의 없이 바꾸지 말 것.

    **인증** — `Authorization: Bearer {accessToken}`.
    401 + `TOKEN_EXPIRED`면 `POST /api/auth/refresh`로 재발급, `TOKEN_INVALID`면 재로그인.

    **검증** — Joi + `validate` 미들웨어. 실패 시 **400 + 첫 번째 에러 메시지**(code 없음).
    body·query·params 필드명은 `snake_case`가 원칙이나, learning·attendance 등 일부 도메인의 **응답**은
    `camelCase`를 쓴다(기존 프론트 연동 유지). 각 스키마의 실제 필드명을 따를 것.

    **페이지네이션** — 두 방식이 공존한다.
    · offset(`?page=&limit=` → `pagination: { page, limit, total }`) — 총 개수가 필요한 목록(주문·랭킹)
    · cursor(`?cursor=&limit=` → `hasNext`) — 무한 스크롤(커뮤니티 피드)

    **시간** — DB TIMESTAMP(UTC) → JSON ISO 8601 문자열. `DATE` 컬럼은 드라이버가 `Date`로 변환하므로
    별도 포맷팅이 없는 곳(예: 월별 출석의 `attendanceDates`)은 ISO date-time으로 내려간다.

    **실시간(Socket.IO)** — 시세 틱은 REST가 아니라 Socket.IO로 전달된다(OpenAPI 표현 불가).
    계약은 [stock-chart.md](stock-chart.md#socketio-실시간-계약) 참조:
    `subscribe`/`unsubscribe`(C→S), `subscribed`/`subscribe-error`/`price`/`resync`(S→C).

  contact:
    name: Plainedu Backend
    url: https://github.com/Plain-edu/Plainedu-Backend
  license:
    name: ISC

servers:
  - url: http://localhost:3000
    description: 로컬 개발 서버
  - url: /
    description: 배포 서버 (동일 오리진)

tags:
  - name: auth
    description: OAuth 로그인 · 토큰 재발급/무효화
  - name: user
    description: 마이페이지 프로필 · 출석
  - name: school
    description: 학교 검색 · 커리어넷 동기화
  - name: team
    description: 팀 생성/가입 · 팀 계좌
  - name: learning
    description: 학습(숏폼·퀴즈). 전 라우트 인증 필수.
  - name: community
    description: 게시글 · 댓글 · 좋아요/스크랩 · 팔로우 · 알림
  - name: stock
    description: 종목 검색 · 관심종목 · 시세 차트/현재가
  - name: trading
    description: 모의투자 주문 (개인 · 팀)
  - name: account
    description: 가상계좌 평가 · 자산 추이
  - name: portfolio
    description: 모델포트폴리오(MP) 작성·투표·전략 준수도
  - name: ranking
    description: 시즌 리그 (개인 · 팀 · 소속 2종)
  - name: system
    description: 헬스체크

security:
  - bearerAuth: []

paths:
  # ───────────────────────────── auth ─────────────────────────────
  /api/auth/kakao/start:
    get:
      tags: [auth]
      summary: 카카오 브라우저 로그인 시작
      description: 백엔드가 OAuth state를 저장하고 카카오 로그인 화면으로 리다이렉트한다.
      security: []
      parameters:
        - $ref: '#/components/parameters/OAuthReturnTo'
      responses:
        '302': { description: 카카오 authorization URL로 이동 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/auth/naver/start:
    get:
      tags: [auth]
      summary: 네이버 브라우저 로그인 시작
      description: 백엔드가 OAuth state를 저장하고 네이버 로그인 화면으로 리다이렉트한다.
      security: []
      parameters:
        - $ref: '#/components/parameters/OAuthReturnTo'
      responses:
        '302': { description: 네이버 authorization URL로 이동 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/auth/oauth-ticket:
    post:
      tags: [auth]
      summary: 브라우저 OAuth ticket을 백엔드 세션으로 교환
      description: callback이 발급한 60초 수명의 1회용 ticket을 소비해 access/refresh token을 반환한다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OAuthTicketRequest' }
      responses:
        '200': { $ref: '#/components/responses/LoginOk' }
        '201': { $ref: '#/components/responses/LoginCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/auth/kakao:
    post:
      tags: [auth]
      summary: 카카오 로그인
      description: |
        인가 코드를 카카오 토큰으로 교환해 프로필을 조회하고, 가입/로그인 후 토큰 쌍을 발급한다.
        로그인마다 개인 가상계좌 존재를 보장한다(없으면 생성).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OAuthCodeRequest' }
      responses:
        '200': { $ref: '#/components/responses/LoginOk' }
        '201': { $ref: '#/components/responses/LoginCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403':
          description: 카카오 이메일 제공 미동의 (`EMAIL_REQUIRED`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: 다른 소셜 계정으로 이미 가입됨 (`PROVIDER_CONFLICT`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/auth/naver:
    post:
      tags: [auth]
      summary: 네이버 로그인
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/OAuthCodeRequest'
                - type: object
                  properties:
                    state:
                      type: string
                      description: 네이버 CSRF state 값
                      example: 'RANDOM_STATE'
      responses:
        '200': { $ref: '#/components/responses/LoginOk' }
        '201': { $ref: '#/components/responses/LoginCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: 다른 소셜 계정으로 이미 가입됨 (`PROVIDER_CONFLICT`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/auth/google:
    post:
      tags: [auth]
      summary: 구글 로그인
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OAuthCodeRequest' }
      responses:
        '200': { $ref: '#/components/responses/LoginOk' }
        '201': { $ref: '#/components/responses/LoginCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: 다른 소셜 계정으로 이미 가입됨 (`PROVIDER_CONFLICT`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/auth/refresh:
    post:
      tags: [auth]
      summary: 액세스 토큰 재발급
      description: |
        리프레시 토큰을 회전(rotate)시키며 새 토큰 쌍을 발급한다.
        슬라이딩 만료 7일 · 절대 만료 90일(최초 발급 기준 고정).
        **이미 소비된 토큰이 다시 들어오면 탈취로 간주해 해당 계보(family) 전체를 폐기**한다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshTokenRequest' }
      responses:
        '200':
          description: 재발급 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/TokenPair' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: |
            `REFRESH_TOKEN_INVALID` · `REFRESH_TOKEN_EXPIRED` · `TOKEN_REUSE_DETECTED` → 모두 재로그인
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/auth/firebase-token:
    post:
      tags: [auth]
      summary: Firebase 세션을 백엔드 토큰으로 교환
      description: |
        Plain edu Firebase 프로젝트가 발급한 ID 토큰을 서버에서 검증하고 백엔드 사용자 및
        개인 가상계좌를 보장한 뒤 access/refresh 토큰 쌍을 발급한다. 기존 이메일 사용자가
        있으면 중복 계정을 만들지 않고 해당 사용자에 연결한다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FirebaseTokenRequest' }
      responses:
        '200': { $ref: '#/components/responses/LoginOk' }
        '201': { $ref: '#/components/responses/LoginCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: Firebase 토큰이 유효하지 않음 (`FIREBASE_TOKEN_INVALID`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/auth/qa-session:
    post:
      tags: [auth]
      summary: 메인 환경 QA 로그인 (임시)
      description: |
        QA 기간에만 활성화되는 PIN 기반 로그인이다.
        메인 DB의 전용 더미 계정과 투자 fixture에 접속하며 세션은 8시간 뒤 만료된다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pin]
              properties:
                pin:
                  type: string
                  pattern: '^\\d{6,12}$'
                  example: '000000'
      responses:
        '201': { $ref: '#/components/responses/LoginCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { description: QA PIN 불일치 (`QA_PIN_INVALID`) }
        '404': { description: QA 로그인 비활성화 (`QA_AUTH_DISABLED`) }
        '429': { description: QA PIN 요청 한도 초과 (`RATE_LIMITED`) }
        '503': { description: QA fixture 미준비 (`QA_DATA_NOT_READY`) }

  /api/auth/email/send:
    post:
      tags: [auth]
      summary: 대학교 이메일 인증코드 발송
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200': { $ref: '#/components/responses/EmptySuccess' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { description: 요청 한도 초과 (`RATE_LIMITED`). 발송은 시간당 3회. }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/auth/email/verify:
    post:
      tags: [auth]
      summary: 대학교 이메일 인증코드 확인
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email: { type: string, format: email }
                code: { type: string, pattern: '^\\d{6}$' }
      responses:
        '200': { $ref: '#/components/responses/EmptySuccess' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { description: 요청 한도 초과 (`RATE_LIMITED`). 5분당 10회. }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/auth/phone/send:
    post:
      tags: [auth]
      summary: 휴대폰 인증번호 발송
      description: |
        입력한 번호로 6자리 인증번호를 SMS 발송한다. 하이픈은 서버가 제거하므로
        `010-1234-5678`과 `01012345678` 중 무엇을 보내도 된다.

        응답의 `cooldownSeconds`(재발송까지 남은 초)와 `expiresInSeconds`(인증번호 유효시간)로
        프론트 타이머를 띄우면 된다. 쿨다운 중 재요청하면 `429 RESEND_COOLDOWN`이고,
        메시지에 남은 초가 담긴다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string, example: '01012345678' }
      responses:
        '200':
          description: 발송 완료
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          cooldownSeconds: { type: integer, example: 30 }
                          expiresInSeconds: { type: integer, example: 180 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { description: 이미 다른 계정에서 인증된 번호 (`PHONE_ALREADY_USED`) }
        '429': { description: 재발송 쿨다운(`RESEND_COOLDOWN`) 또는 요청 한도 초과(`RATE_LIMITED`). 발송은 시간당 3회. }
        '502': { description: SMS 발송 실패 (`SMS_SEND_FAILED`) }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/auth/phone/verify:
    post:
      tags: [auth]
      summary: 휴대폰 인증번호 확인
      description: |
        인증번호가 맞으면 번호를 계정에 저장한다. 저장 결과는 `GET /api/users/me`의
        `phone` 필드로 확인한다.

        실패 사유는 `code`로 구분된다 — `CODE_EXPIRED`(만료·미발송),
        `CODE_MISMATCH`(불일치), `PHONE_ALREADY_USED`(다른 계정이 선점).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code]
              properties:
                phone: { type: string, example: '01012345678' }
                code: { type: string, pattern: '^\\d{6}$' }
      responses:
        '200': { $ref: '#/components/responses/EmptySuccess' }
        '400': { description: 인증번호 만료(`CODE_EXPIRED`) 또는 불일치(`CODE_MISMATCH`) }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { description: 이미 다른 계정에서 인증된 번호 (`PHONE_ALREADY_USED`) }
        '429': { description: 요청 한도 초과 (`RATE_LIMITED`). 5분당 10회. }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/auth/logout:
    post:
      tags: [auth]
      summary: 로그아웃 (리프레시 토큰 계보 폐기)
      description: 존재하지 않는 토큰이어도 200 (멱등).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshTokenRequest' }
      responses:
        '200': { $ref: '#/components/responses/EmptySuccess' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/ServerError' }

  /auth/{provider}/callback:
    get:
      tags: [auth]
      summary: 백엔드 소셜 OAuth callback
      description: |
        공급자 콘솔에 등록된 backend callback이다. state를 한 번만 소비하고 공급자 프로필과
        백엔드 사용자를 만든 뒤, 백엔드 토큰 대신 60초 수명의 1회용 ticket을 프론트 callback
        URL fragment로 전달한다. **`/api` prefix가 없다.**
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [kakao, naver]
        - name: code
          in: query
          required: true
          schema: { type: string }
          description: 제공사가 붙여주는 인가 코드
        - name: state
          in: query
          schema: { type: string }
          description: 백엔드가 발급하고 검증하는 CSRF state
      responses:
        '302': { description: 허용된 프론트 callback으로 이동 }
        '400': { $ref: '#/components/responses/BadRequest' }

  # ───────────────────────────── user ─────────────────────────────
  /api/users:
    get:
      tags: [user]
      summary: '[스텁] 유저 목록'
      description: 예시 수준의 스텁이다. 실서비스 화면에서 쓰지 않는다.
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/UserBrief' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/users/me:
    get:
      tags: [user]
      summary: 마이페이지 프로필 (PM-01)
      description: |
        프로필 카드(닉네임·소속·역할) + 활동 요약(연속학습·포인트·리그순위) + 자산 요약을 한 번에 반환한다.
        `league_rank`는 ranking 도메인 조회 결과로, 순위판 미계산·학교 미설정 시 `null`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/MyProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
    patch:
      tags: [user]
      summary: 프로필 편집 (PM-03)
      description: |
        닉네임 또는 학교를 변경한다. 온보딩에서 `school_id`만 보내는 요청도 허용한다.
        학교를 변경하면 기존 학교 인증은 해제되고 개인 계좌의 학교 그룹이 동기화된다.
        팀에 소속된 사용자는 학교를 변경할 수 없다. `position` 변경은 지원하지 않는다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                nickname:
                  type: string
                  minLength: 1
                  maxLength: 50
                  example: 새닉네임
                school_id:
                  type: integer
                  minimum: 1
                  example: 42
      responses:
        '200':
          description: 수정된 유저 기본 정보
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/UserBasic' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: 팀 소속 중 학교 변경 시도
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
    delete:
      tags: [user]
      summary: 회원 탈퇴 (AUTH-14)
      description: FK CASCADE로 계좌·주문·출석·팀 멤버십·게시글·알림 등이 함께 삭제된다. 복구 불가.
      responses:
        '200':
          description: '레거시 응답 — `data` 없이 `{ success, message }`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageOnly' }
              example:
                success: true
                message: 회원 탈퇴가 완료되었습니다.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/users/me/agreements:
    patch:
      tags: [user]
      summary: 약관·개인정보·마케팅 동의 저장
      description: |
        온보딩 동의 화면과 마이페이지 설정이 함께 쓴다. **보낸 항목만 갱신하는 부분 수정**이라
        마케팅만 끄는 요청도 그대로 보내면 된다.

        동의 시각과 동의 당시의 약관 버전은 서버가 함께 기록한다.

        조회용 API는 따로 없다 — `GET /api/users/me`의 `agreements` 필드가 담당한다.
        온보딩 진행 판정이 한 번의 호출로 끝나야 해서다.

        필수 항목(`terms`, `privacy`)은 `true`만 받는다. 가입 상태에서 필수 동의를 철회한
        모호한 계정을 만들지 않기 위해서이며, 철회는 `DELETE /api/users/me`(탈퇴) 소관이다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                terms: { type: boolean, enum: [true], description: 서비스 이용약관 (필수) }
                privacy: { type: boolean, enum: [true], description: 개인정보 처리방침 (필수) }
                marketing: { type: boolean, description: 마케팅 수신 (선택, 철회 가능) }
              example:
                terms: true
                privacy: true
                marketing: false
      responses:
        '200':
          description: 갱신된 전체 동의 상태
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Agreements' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/users/attendance/check-in:
    post:
      tags: [user]
      summary: 출석 체크인
      description: |
        앱 접속 시 프론트가 **명시적으로** 호출한다(GET에 부수효과를 두지 않기 위해 분리).
        오늘 이미 출석했으면 아무것도 하지 않고 200 (멱등).
        직전 출석과 하루 차이면 `consecutive_days`가 이어지고, 그 이상이면 1로 리셋된다.
      responses:
        '200':
          description: '레거시 응답 — `data` 없이 `{ success, message }`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageOnly' }
              example:
                success: true
                message: 출석 처리되었습니다.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/users/attendance/streak:
    get:
      tags: [user]
      summary: 이번 주 출석 + 연속학습일
      description: 칭찬 화면(퀴즈 완료 후 등)용. 이번 주 **월~일 7칸** 체크리스트를 항상 채워서 내려준다.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AttendanceStreak' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/users/attendance:
    get:
      tags: [user]
      summary: 월별 출석 조회
      description: '`year`·`month`는 **둘 다 보내거나 둘 다 생략**해야 한다(하나만 오면 400). 생략 시 이번 달.'
      parameters:
        - name: year
          in: query
          schema: { type: integer, minimum: 2020, maximum: 2100 }
          example: 2026
        - name: month
          in: query
          schema: { type: integer, minimum: 1, maximum: 12 }
          example: 8
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/MonthlyAttendance' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  # ──────────────────────────── school ────────────────────────────
  /api/schools:
    get:
      tags: [school]
      summary: 학교 검색
      description: 커리어넷에서 동기화한 학교 데이터를 검색한다. 조건 없이 호출하면 이름순 상위 `limit`건.
      security: []
      parameters:
        - name: keyword
          in: query
          schema: { type: string, maxLength: 100 }
          description: 학교명 부분 일치
          example: 연세
        - name: region
          in: query
          schema: { type: string, maxLength: 50 }
          description: 지역 완전 일치
          example: 서울
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/School' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/schools/sync:
    post:
      tags: [school]
      summary: 커리어넷 학교 동기화 (관리자 전용)
      description: |
        커리어넷 오픈 API를 페이지 순회하며 `schools` 테이블에 upsert 한다.
        `(school_name, region)` UNIQUE 기준이라 재실행해도 안전(멱등).
        **`role = ADMIN`이 아니면 403.** 전체 동기화는 수 분이 걸릴 수 있다.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                gubuns:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    enum: [elem_list, midd_list, high_list, univ_list]
                  description: '생략 시 서비스 기본값 `[high_list, univ_list]`'
            example:
              gubuns: [high_list, univ_list]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/SchoolSyncResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 관리자 권한 없음
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/ServerError' }

  # ───────────────────────────── team ─────────────────────────────
  /api/teams:
    post:
      tags: [team]
      summary: 팀 생성
      description: |
        팀과 팀 계좌를 함께 만들고 요청자를 `LEADER`로 등록한다. 요청자의 `position`도 함께 갱신된다.
        **선행 조건:** 대학은 학교 이메일 인증 완료, 고교는 학교 선택 완료. 조건 미충족이면 403.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, position]
              properties:
                name: { type: string, minLength: 2, maxLength: 50, example: Investars }
                position: { $ref: '#/components/schemas/Position' }
                max_member_count:
                  type: integer
                  minimum: 2
                  maximum: 8
                  default: 4
      responses:
        '201':
          description: 생성됨
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Team' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 학교 선택 또는 대학 이메일 인증 필요
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: 이미 팀에 소속됨 / 같은 학교에 동명 팀 존재
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/ServerError' }
    get:
      tags: [team]
      summary: 같은 학교 팀 목록/검색
      description: '**요청자와 같은 학교** 팀만 반환한다. `page`는 없다(limit만).'
      parameters:
        - name: keyword
          in: query
          schema: { type: string, maxLength: 50 }
          description: 팀명 부분 일치
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/TeamListItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 학교 선택 또는 대학 이메일 인증 필요
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/teams/join:
    post:
      tags: [team]
      summary: 팀 가입
      description: '가입 코드(8자)로 참여한다. **같은 학교 팀만** 가능. 요청자의 `position`도 함께 갱신된다.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [join_code, position]
              properties:
                join_code:
                  type: string
                  minLength: 8
                  maxLength: 8
                  description: 대문자로 정규화되어 처리된다
                  example: A1B2C3D4
                position: { $ref: '#/components/schemas/Position' }
      responses:
        '200':
          description: 가입 완료 (팀 상세 반환)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Team' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 학교 선택 또는 대학 이메일 인증 필요 / 다른 학교의 팀
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: 유효하지 않은 가입 코드
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: 이미 팀 소속 / 정원 초과
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/teams/me:
    get:
      tags: [team]
      summary: 내 팀 조회
      description: |
        ⚠️ `members[]`에는 팀 내 권한인 `role`(LEADER/MEMBER)만 있고
        투자 포지션 `position`(TRADER/ANALYST)은 없다 (api-catalog.md 백로그 P2 참조).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Team' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: 소속된 팀이 없음
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/ServerError' }
    delete:
      tags: [team]
      summary: 팀 해체
      description: |
        팀장만 호출할 수 있다. 팀원·포트폴리오·팀 계좌·팀 주문·보유종목이 함께 삭제되며 복구할 수 없다.
        팀원 전원의 투자 포지션은 `NONE`으로 돌아간다.

        과거 순위 기록(`DailyRankings`)은 남는다 — 확정 시점의 팀 이름을 함께 저장해두므로
        팀이 사라진 뒤에도 지난 순위표를 읽을 수 있다.
      responses:
        '200':
          description: 해체 완료
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          result: { type: string, enum: [DISBANDED] }
                          team_id: { type: integer, example: 5 }
                          removed_members: { type: integer, example: 3 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: 소속된 팀이 없거나 팀장이 아님 (`NOT_TEAM_LEADER`) }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/teams/me/exit-options:
    get:
      tags: [team]
      summary: 팀 탈퇴 가능 조건
      description: |
        탈퇴 화면이 무엇을 보여줄지 서버가 판정해서 내려준다. 프론트가 인원수·역할로 조건을
        추측하지 않도록 가능한 행동과 불가능한 이유를 함께 준다.

        `leave_effect`가 `POST /leave`를 눌렀을 때 실제로 일어날 일이다.
        `LEAVE`(그냥 탈퇴) · `AUTO_DELEGATE`(가장 오래된 팀원에게 자동 위임 후 탈퇴) ·
        `DISBAND`(혼자라서 탈퇴가 곧 해체).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/TeamExitOptions' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: 소속된 팀이 없음 }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/teams/me/leave:
    post:
      tags: [team]
      summary: 팀 탈퇴
      description: |
        상황에 따라 결과가 갈린다. 무엇이 일어날지는 `GET /api/teams/me/exit-options`의
        `leave_effect`로 미리 알 수 있다.

        - 일반 팀원 → `LEFT`
        - 팀장이고 다른 팀원이 있음 → 가장 오래된 팀원에게 자동 위임 후 탈퇴 (`DELEGATED_AND_LEFT`)
        - 팀장이고 혼자 → 팀 해체 (`DISBANDED`)

        어느 경로든 한 트랜잭션이라 위임만 되고 탈퇴가 안 되는 중간 상태는 생기지 않는다.
        탈퇴한 사람의 투자 포지션은 `NONE`으로 돌아간다.
      responses:
        '200':
          description: 탈퇴 완료
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/TeamLeaveResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: 소속된 팀이 없음 }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/teams/me/delegate-and-leave:
    post:
      tags: [team]
      summary: 팀장 위임 후 탈퇴
      description: |
        넘겨받을 팀원을 직접 고르는 경로다. 아무나 상관없으면 `POST /api/teams/me/leave`가
        가장 오래된 팀원에게 알아서 위임한다. 위임과 탈퇴는 원자적으로 처리된다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id:
                  type: integer
                  description: 팀장을 넘겨받을 팀원. `exit-options`의 `delegatable_members`에서 고른다.
                  example: 12
      responses:
        '200':
          description: 위임 후 탈퇴 완료
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/TeamLeaveResult' }
        '400': { description: 자기 자신에게 위임 시도 (`INVALID_SUCCESSOR`) }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: 소속된 팀이 없거나 팀장이 아님 (`NOT_TEAM_LEADER`) }
        '404': { description: 같은 팀의 팀원이 아님 (`MEMBER_NOT_FOUND`) }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/teams/me/rules:
    get:
      tags: [team]
      summary: 팀 규칙 조회
      description: |
        규칙을 아직 쓰지 않은 팀은 `content: null`, `version: 0`으로 내려간다 — 오류가 아니라
        빈 상태이므로 작성 안내를 띄우면 된다.

        저장할 때 여기서 받은 `version`을 그대로 돌려보내야 한다.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/TeamRules' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: 소속된 팀이 없음 }
        '500': { $ref: '#/components/responses/ServerError' }
    put:
      tags: [team]
      summary: 팀 규칙 저장
      description: |
        팀장만 저장할 수 있다. 조회할 때 받은 `version`을 함께 보내며, 그 사이 다른 사람이
        먼저 저장했으면 `409 RULES_VERSION_CONFLICT`가 난다 — 규칙은 자유 텍스트라 병합할
        수단이 없어서 덮어쓰는 대신 다시 읽도록 한다. 규칙이 없던 팀의 첫 저장은 `version: 0`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content, version]
              properties:
                content: { type: string, minLength: 1, maxLength: 5000 }
                version: { type: integer, minimum: 0, description: 조회 시 받은 값. 첫 저장은 0. }
      responses:
        '200':
          description: 저장된 규칙
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/TeamRules' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: 소속된 팀이 없거나 팀장이 아님 (`NOT_TEAM_LEADER`) }
        '409': { description: 그 사이 다른 팀원이 먼저 저장함 (`RULES_VERSION_CONFLICT`) }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/teams/me/members/{userId}/role:
    patch:
      tags: [team]
      summary: 팀원 역할·포지션 변경
      description: |
        팀장만 호출할 수 있다. `role`과 `position` 중 최소 하나를 보낸다.

        `role: LEADER`는 곧 **위임**이다 — 대상이 팀장이 되고 요청한 팀장은 같은 트랜잭션에서
        `MEMBER`로 내려간다. 팀장이 위임 없이 스스로 `MEMBER`가 되려 하면 팀장 없는 팀이
        되므로 `409 LAST_LEADER`로 막는다.
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
          description: 변경할 팀원
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                role: { type: string, enum: [LEADER, MEMBER] }
                position: { type: string, enum: [TRADER, ANALYST] }
      responses:
        '200':
          description: 변경 후 팀 정보
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Team' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: 소속된 팀이 없거나 팀장이 아님 (`NOT_TEAM_LEADER`) }
        '404': { description: 같은 팀의 팀원이 아님 (`MEMBER_NOT_FOUND`) }
        '409': { description: 마지막 팀장이 위임 없이 강등을 시도 (`LAST_LEADER`) }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/teams/me/account:
    get:
      tags: [team, account]
      summary: 팀 계좌 요약 + 보유종목 (TH-01/TT-01)
      description: |
        응답 스키마가 `GET /api/accounts/me`와 **완전히 동일**하다 —
        프론트 상단 Scope 토글(개인↔팀)에서 같은 컴포넌트를 재사용하도록 일부러 맞췄다.
      responses:
        '200': { $ref: '#/components/responses/AccountSummaryOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 소속된 팀이 없음
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/teams/me/account/history:
    get:
      tags: [team, account]
      summary: 팀 성과 추이 (TH-01)
      description: '`GET /api/accounts/me/history`와 동일 스키마.'
      responses:
        '200': { $ref: '#/components/responses/AssetHistoryOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 소속된 팀이 없음
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/ServerError' }

  # ─────────────────────────── learning ───────────────────────────
  /api/learning/topics:
    get:
      tags: [learning]
      summary: 학습 메인 (주제 목록 + 진행현황 + 오늘의 플로우 + 레벨)
      parameters:
        - name: level
          in: query
          schema: { type: integer, minimum: 1, maximum: 10, default: 1 }
          description: 조회할 레벨
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/LearningHome' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/learning/topics/{topicId}/shortforms:
    get:
