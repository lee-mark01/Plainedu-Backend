        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 숏폼 미완료 (`SHORTFORM_NOT_COMPLETED`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: 존재하지 않는 주제 (`TOPIC_NOT_FOUND`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/learning/quizzes/{quizId}/answer:
    post:
      tags: [learning]
      summary: 퀴즈 단건 채점
      description: |
        1문제 풀이 직후 즉시 채점한다. 재도전을 허용하므로 같은 퀴즈에 여러 로그가 쌓일 수 있다.

        `answer` 형식은 퀴즈 `type`에 따라 다르다:
        | type | answer |
        |---|---|
        | `CHOICE` | 선택지 번호 (number) |
        | `OX` | `"O"` 또는 `"X"` |
        | `SHORT` | 문자열 (공백·대소문자 무시 비교, 복수 정답 허용) |
        | `MATCH` | 문자열 배열 (순서 무관) |
      parameters:
        - $ref: '#/components/parameters/QuizId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answer]
              properties:
                answer:
                  oneOf:
                    - type: string
                    - type: number
                    - type: array
                      items: { type: string }
                  example: 2
      responses:
        '200':
          description: 채점 결과
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/QuizAnswerResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: 존재하지 않는 퀴즈 (`QUIZ_NOT_FOUND`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/learning/topics/{topicId}/quizzes/complete:
    post:
      tags: [learning]
      summary: 퀴즈 세션 완료 (결과 페이지)
      description: '주제의 **모든 문제를 한 번씩은** 풀어야 완료된다. 미완이면 400 `QUIZ_NOT_FINISHED`.'
      parameters:
        - $ref: '#/components/parameters/TopicId'
      responses:
        '200':
          description: 세션 결과
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/QuizSessionResult' }
        '400':
          description: 아직 풀지 않은 문제가 있음 (`QUIZ_NOT_FINISHED`) 또는 검증 실패
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: 주제 없음 (`TOPIC_NOT_FOUND`) / 주제에 퀴즈 없음 (`QUIZ_NOT_FOUND`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/ServerError' }

  # ─────────────────────────── community ──────────────────────────
  /api/community/posts:
    post:
      tags: [community]
      summary: 게시글 작성
      description: 작성자의 팔로워 전원에게 `FOLLOWEE_POST` 알림이 발송된다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePostRequest' }
      responses:
        '201':
          description: 생성됨
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Post' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }
    get:
      tags: [community]
      summary: 게시글 목록 (커서 기반)
      description: |
        무한 스크롤용. 다음 페이지는 마지막 항목의 `id`를 `cursor`로 넘긴다(내림차순).

        ⚠️ `keyword`와 `search_type`은 **반드시 함께** 보내야 한다 (Joi `.and()` — 하나만 오면 400).
      security: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: post_type
          in: query
          schema: { $ref: '#/components/schemas/PostType' }
        - name: stock_code
          in: query
          schema: { type: string }
          example: AAPL
        - name: keyword
          in: query
          schema: { type: string }
          description: '`search_type`과 함께 보낼 것'
        - name: search_type
          in: query
          schema:
            type: string
            enum: [TITLE, CONTENT, AUTHOR]
          description: '`keyword`와 함께 보낼 것'
      responses:
        '200': { $ref: '#/components/responses/PostPageOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/community/posts/my:
    get:
      tags: [community]
      summary: 내 게시글 목록 (커서 기반)
      parameters:
