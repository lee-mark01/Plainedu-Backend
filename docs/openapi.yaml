        '500': { $ref: '#/components/responses/ServerError' }

  /api/learning/shortforms/{shortformId}/complete:
    post:
      tags: [learning]
      summary: 숏폼 시청 완료
      description: 해당 주제의 숏폼을 전부 완료하면 `UserProgress.is_shortform_done`이 켜지고 퀴즈가 열린다.
      parameters:
        - $ref: '#/components/parameters/ShortformId'
      responses:
        '200':
          description: '레거시 응답 — `data` 없이 `{ success, message }`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageOnly' }
              example:
                success: true
                message: 시청 완료 처리되었습니다.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: 존재하지 않는 숏폼 (`SHORTFORM_NOT_FOUND`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/learning/shortforms/{shortformId}/like:
    patch:
      tags: [learning]
      summary: 숏폼 좋아요 토글
      parameters:
        - $ref: '#/components/parameters/ShortformId'
      responses:
        '200':
          description: 토글 후 상태
