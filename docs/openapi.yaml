        '500': { $ref: '#/components/responses/ServerError' }
    patch:
      tags: [community]
      summary: 게시글 수정
      description: 본인 글만 수정 가능. 보낸 필드만 갱신된다(최소 1개 필수).
      parameters:
        - $ref: '#/components/parameters/PostIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
