                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/BookmarkedPost' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/community/posts/{id}:
    get:
