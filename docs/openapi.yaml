                    properties:
                      data: { $ref: '#/components/schemas/QuizList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 숏폼 미완료 (`SHORTFORM_NOT_COMPLETED`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: 존재하지 않는 주제 (`TOPIC_NOT_FOUND`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/learning/quizzes/{quizId}/answer:
    post:
      tags: [learning]
      summary: 퀴즈 단건 채점
      description: |
        1문제 풀이 직후 즉시 채점한다. 재도전을 허용하므로 같은 퀴즈에 여러 로그가 쌓일 수 있다.

        `answer` 형식은 퀴즈 `type`에 따라 다르다:
        | type | answer |
        |---|---|
        | `CHOICE` | 선택지 번호 (number) |
        | `OX` | `"O"` 또는 `"X"` |
        | `SHORT` | 문자열 (공백·대소문자 무시 비교, 복수 정답 허용) |
        | `MATCH` | 문자열 배열 (순서 무관) |
      parameters:
        - $ref: '#/components/parameters/QuizId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answer]
              properties:
                answer:
                  oneOf:
                    - type: string
                    - type: number
                    - type: array
                      items: { type: string }
                  example: 2
      responses:
        '200':
          description: 채점 결과
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/QuizAnswerResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: 존재하지 않는 퀴즈 (`QUIZ_NOT_FOUND`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/learning/topics/{topicId}/quizzes/complete:
    post:
      tags: [learning]
      summary: 퀴즈 세션 완료 (결과 페이지)
      description: '주제의 **모든 문제를 한 번씩은** 풀어야 완료된다. 미완이면 400 `QUIZ_NOT_FINISHED`.'
      parameters:
        - $ref: '#/components/parameters/TopicId'
      responses:
        '200':
          description: 세션 결과
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/QuizSessionResult' }
        '400':
          description: 아직 풀지 않은 문제가 있음 (`QUIZ_NOT_FINISHED`) 또는 검증 실패
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: 주제 없음 (`TOPIC_NOT_FOUND`) / 주제에 퀴즈 없음 (`QUIZ_NOT_FOUND`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/ServerError' }

  # ─────────────────────────── community ──────────────────────────
