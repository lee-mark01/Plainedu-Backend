        - name: keyword
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 50 }
          example: apple
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200': { $ref: '#/components/responses/StockListOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/stocks/watchlist:
    get:
      tags: [stock]
      summary: 내 관심종목 목록 (현재가 포함)
      description: '시세 조회에 실패한 종목은 `price`·`change`·`changePercent`가 `null`로 내려온다 — 목록 자체는 항상 200.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
