      description: '**숏폼 선행 완료 필수** — 미완료 시 403 `SHORTFORM_NOT_COMPLETED`(프론트는 숏폼 화면으로 유도).'
      parameters:
        - $ref: '#/components/parameters/TopicId'
      responses:
        '200':
          description: OK
