name: Deploy to EC2

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Project
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Verify Auth Contract
        run: |
          npm run check:openapi
          node --test --test-force-exit tests/oauthBrowser.service.test.js tests/oauthBrowser.wiring.test.js

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          MAIN_QA_AUTH_PIN_HASH: ${{ secrets.QA_AUTH_PIN_HASH }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: MAIN_QA_AUTH_PIN_HASH
          script: |
            cd ~/Plainedu-Backend
            git pull origin main
            sed -i '/^MAIN_QA_AUTH_ENABLED=/d; /^MAIN_QA_AUTH_PIN_HASH=/d' .env
            printf 'MAIN_QA_AUTH_ENABLED=true\n' >> .env
            printf 'MAIN_QA_AUTH_PIN_HASH=%s\n' "$MAIN_QA_AUTH_PIN_HASH" >> .env
            docker compose build app
            docker compose up -d
            docker compose exec -T app npm run migrate
            docker compose exec -T app npm run seed:main-qa
            curl --fail --silent --show-error http://localhost:3000/api/health >/dev/null
