name: Deploy to EC2

on:
  push:
    branches: [main]

jobs:
  # 배포 전 게이트. ci.yml을 그대로 호출하므로 테스트 정의가 한 곳에만 존재한다.
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test          # ← 테스트가 빨간불이면 여기서 멈춘다 (EC2에 손도 안 댐)
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/Plainedu-Backend
            git pull origin main
            docker compose build app
            docker compose up -d
            docker compose exec -T app npm run migrate
